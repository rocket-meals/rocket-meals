name: Check Build Number
description: Vergleicht, ob sich die Buildnummer in app.config.ts geändert hat

inputs:
  working-directory:
    required: false
    description: 'Das Verzeichnis, in dem sich die app.config.ts befindet'
    default: apps/frontend/app

runs:
  using: "composite"
  steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        # Get full history to handle both push and workflow_run scenarios

    - name: 🔍 Vergleiche Buildnummer
      id: check
      run: |
        # Determine the comparison commits based on trigger type
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          # For workflow_run, compare the triggering commit with its parent
          # The triggering commit is stored in github.event.workflow_run.head_sha
          TRIGGER_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -n "$TRIGGER_SHA" ]; then
            echo "🔄 Using workflow_run trigger SHA: $TRIGGER_SHA"
            # Get the parent of the triggering commit for comparison
            OLD_SHA=$(git rev-parse ${TRIGGER_SHA}^)
            NEW_SHA=$TRIGGER_SHA
          else
            echo "⚠️ No workflow_run head_sha found, falling back to HEAD comparison"
            OLD_SHA="HEAD^"
            NEW_SHA="HEAD"
          fi
        else
          # For push events, compare HEAD with its parent
          echo "🔄 Using push trigger, comparing HEAD^ with HEAD"
          OLD_SHA="HEAD^"
          NEW_SHA="HEAD"
        fi

        echo "📍 Comparing $OLD_SHA with $NEW_SHA"

        # Extract build numbers from both commits
        old=$(git show ${OLD_SHA}:${{ inputs.working-directory }}/config.ts | grep -A 5 'function getBuildNumber' | grep 'return' | grep -Eo '[0-9]+' | head -1 || echo "not-found")
        new=$(git show ${NEW_SHA}:${{ inputs.working-directory }}/config.ts | grep -A 5 'function getBuildNumber' | grep 'return' | grep -Eo '[0-9]+' | head -1 || echo "not-found")
        
        echo "📦 Old build number: $old"
        echo "📦 New build number: $new"

        if [ "$old" = "not-found" ]; then
          echo "⚠️ Old build number not found, skipping comparison"
          echo "changed=skip" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$new" = "not-found" ]; then
          echo "⚠️ New build number not found, skipping comparison"
          echo "changed=skip" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$old" != "$new" ]; then
          echo "✅ Build number changed ($old → $new)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "🚫 Build number unchanged ($old)"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash


outputs:
  changed:
    description: 'true, wenn die Buildnummer sich geändert hat'
    value: ${{ steps.check.outputs.changed }}
