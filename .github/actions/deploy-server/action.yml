name: 'Deploy to Server'
description: 'Deploy to a server via SSH by running the update-and-generate-env script'

inputs:
  DEPLOY_SSH_KEY:
    description: 'SSH private key for the deploy user'
    required: true
  DEPLOY_SERVER_HOST:
    description: 'Hostname or IP of the target server'
    required: true
  FORCE_DASHBOARD_OVERWRITE:
    description: 'Overwrite dashboards/panels that were changed in the Directus backend (see docs/DASHBOARD_SYNC_PROTECTION.md)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: "🔑 Setup SSH Key"
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.DEPLOY_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: "🚀 Deploy via SSH"
      shell: bash
      env:
        DEPLOY_SERVER_HOST: ${{ inputs.DEPLOY_SERVER_HOST }}
        FORCE_DASHBOARD_OVERWRITE: ${{ inputs.FORCE_DASHBOARD_OVERWRITE }}
      run: |
        # Normalize the input to a literal true/false, so nothing else can end up in the
        # command that is executed on the server.
        if [ "$FORCE_DASHBOARD_OVERWRITE" = "true" ]; then
          FORCE_FLAG=true
          echo "⚠️ Force-Override: dashboards/panels changed in the backend will be overwritten by the repository state."
        else
          FORCE_FLAG=false
        fi
        echo "🚀 Connecting to $DEPLOY_SERVER_HOST as deploy user..."
        ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i ~/.ssh/deploy_key deploy@"$DEPLOY_SERVER_HOST" \
          "sudo bash -l -c \"cd /root/rocket-meals && DIRECTUS_SYNC_FORCE_OVERWRITE_PROTECTED_COLLECTIONS=$FORCE_FLAG ./scripts/update-and-generate-env.sh\""
        echo "✅ Deploy completed successfully"

    - name: "🧹 Cleanup SSH Key"
      if: always()
      shell: bash
      run: rm -f ~/.ssh/deploy_key
