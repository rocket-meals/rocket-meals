name: "📱 PR Expo Preview"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to redeploy just the web preview for (skips the EAS mobile update)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  check-repository:
    name: "🔍 Check Repository"
    runs-on: ubuntu-latest
    outputs:
      is-upstream: ${{ steps.check.outputs.is-upstream }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Check Repository Type"
        id: check
        uses: ./.github/actions/check-repository

  detect-changes:
    name: "🔍 Detect Changed Apps"
    runs-on: ubuntu-latest
    needs: check-repository
    if: >-
      github.event.action != 'closed'
      && needs.check-repository.outputs.is-upstream == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      geonexia: ${{ steps.changes.outputs.geonexia }}
      score_tracker: ${{ steps.changes.outputs.score_tracker }}
      tag_und_jahr: ${{ steps.changes.outputs.tag_und_jahr }}
      any_changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - name: "🔄 Checkout PR Head"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: "🔍 Detect changed files"
        id: changes
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          PACKAGES_CHANGED=$(echo "$CHANGED" | grep -cE '^packages/' || true)

          if [ "$PACKAGES_CHANGED" -gt "0" ]; then
            echo "Shared packages changed → updating all apps"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "geonexia=true" >> "$GITHUB_OUTPUT"
            echo "score_tracker=true" >> "$GITHUB_OUTPUT"
            echo "tag_und_jahr=true" >> "$GITHUB_OUTPUT"
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            FRONTEND_CHANGED=$(echo "$CHANGED" | grep -cE '^apps/frontend/' || true)
            GEONEXIA_CHANGED=$(echo "$CHANGED" | grep -cE '^apps/geonexia/' || true)
            SCORE_TRACKER_CHANGED=$(echo "$CHANGED" | grep -cE '^apps/score-tracker/' || true)
            TAG_UND_JAHR_CHANGED=$(echo "$CHANGED" | grep -cE '^apps/tag-und-jahr/' || true)

            [ "$FRONTEND_CHANGED" -gt "0" ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
            [ "$GEONEXIA_CHANGED" -gt "0" ] && echo "geonexia=true" >> "$GITHUB_OUTPUT" || echo "geonexia=false" >> "$GITHUB_OUTPUT"
            [ "$SCORE_TRACKER_CHANGED" -gt "0" ] && echo "score_tracker=true" >> "$GITHUB_OUTPUT" || echo "score_tracker=false" >> "$GITHUB_OUTPUT"
            [ "$TAG_UND_JAHR_CHANGED" -gt "0" ] && echo "tag_und_jahr=true" >> "$GITHUB_OUTPUT" || echo "tag_und_jahr=false" >> "$GITHUB_OUTPUT"

            if [ "$FRONTEND_CHANGED" -gt "0" ] || [ "$GEONEXIA_CHANGED" -gt "0" ] || [ "$SCORE_TRACKER_CHANGED" -gt "0" ] || [ "$TAG_UND_JAHR_CHANGED" -gt "0" ]; then
              echo "any_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "any_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  expo-preview-update:
    name: "🚀 EAS Preview Update (PR #${{ github.event.pull_request.number }})"
    runs-on: ubuntu-latest
    needs: [check-repository, detect-changes]
    if: >-
      github.event.action != 'closed'
      && needs.check-repository.outputs.is-upstream == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.detect-changes.outputs.any_changed == 'true')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "🔄 Checkout PR Head"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🚀 EAS Update – Frontend App"
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }}: $PR_TITLE" \
            --platform all --non-interactive
          # Second publish with an exposdk:<version> runtime so the PR can be
          # opened in Expo Go (development builds use the appVersion runtime above).
          EXPO_GO_PREVIEW=true eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} (Expo Go): $PR_TITLE" \
            --platform all --non-interactive
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: "🌍 EAS Update – Geonexia"
        if: needs.detect-changes.outputs.geonexia == 'true'
        run: |
          eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }}: $PR_TITLE" \
            --platform all --non-interactive
          EXPO_GO_PREVIEW=true eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} (Expo Go): $PR_TITLE" \
            --platform all --non-interactive
        working-directory: ./apps/geonexia/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: "🎯 EAS Update – Score Tracker"
        if: needs.detect-changes.outputs.score_tracker == 'true'
        run: |
          eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }}: $PR_TITLE" \
            --platform all --non-interactive
          EXPO_GO_PREVIEW=true eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} (Expo Go): $PR_TITLE" \
            --platform all --non-interactive
        working-directory: ./apps/score-tracker/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: "🕰️ EAS Update – Tag und Jahr"
        if: needs.detect-changes.outputs.tag_und_jahr == 'true'
        run: |
          # Until the first master CI run has created the EAS project (eas init in
          # the tag-und-jahr-expo-update action), there is no project to update.
          if ! grep -q 'projectId' app.config.ts; then
            echo "⏭️ Tag und Jahr has no EAS project yet - skipping preview update."
            exit 0
          fi
          eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }}: $PR_TITLE" \
            --platform all --non-interactive
          EXPO_GO_PREVIEW=true eas update --branch "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} (Expo Go): $PR_TITLE" \
            --platform all --non-interactive
        working-directory: ./apps/tag-und-jahr/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: "💬 Comment on PR"
        uses: actions/github-script@v7
        env:
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          GEONEXIA_CHANGED: ${{ needs.detect-changes.outputs.geonexia }}
          SCORE_TRACKER_CHANGED: ${{ needs.detect-changes.outputs.score_tracker }}
          TAG_UND_JAHR_CHANGED: ${{ needs.detect-changes.outputs.tag_und_jahr }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const branch = `pr-${prNumber}`;
            const marker = '<!-- expo-preview-comment -->';

            const frontendChanged = process.env.FRONTEND_CHANGED === 'true';
            const geonexiaChanged = process.env.GEONEXIA_CHANGED === 'true';
            const scoreTrackerChanged = process.env.SCORE_TRACKER_CHANGED === 'true';
            const tagUndJahrChanged = process.env.TAG_UND_JAHR_CHANGED === 'true';

            const appLines = [
              frontendChanged     ? '- ✅ Frontend (rocket-meals)' : '- ⏭️ Frontend (rocket-meals) – skipped (no changes)',
              geonexiaChanged     ? '- ✅ Geonexia'                : '- ⏭️ Geonexia – skipped (no changes)',
              scoreTrackerChanged ? '- ✅ Score Tracker'           : '- ⏭️ Score Tracker – skipped (no changes)',
              tagUndJahrChanged   ? '- ✅ Tag und Jahr'             : '- ⏭️ Tag und Jahr – skipped (no changes)',
            ];

            const body = [
              marker,
              '## 📱 Expo Preview Update',
              '',
              `An EAS Update has been published for this PR on branch \`${branch}\`. Each app receives two updates: one for development builds (appVersion runtime) and one for Expo Go (exposdk runtime).`,
              '',
              '**How to test in a Development Build:**',
              `1. Open a **Development Build** of the app`,
              `2. Switch the update channel/branch to \`${branch}\``,
              '3. The app will load the latest code from this PR',
              '',
              '**How to test in Expo Go:**',
              `1. Open **Expo Go** – its SDK version must match this PR's Expo SDK`,
              `2. Sign in, open the project and select branch \`${branch}\``,
              '3. Open the update marked **(Expo Go)**',
              '',
              '**Apps updated:**',
              ...appLines,
              '',
              '> ℹ️ This preview will be automatically cleaned up when the PR is closed or merged.',
            ].join('\n');

            // Check for existing comment to update instead of creating duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Updated existing comment #${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log(`Created comment #${created.id}`);
            }

  web-preview-deploy:
    name: "🌐 Web Preview Deploy (PR #${{ github.event.pull_request.number || inputs.pr_number }})"
    runs-on: ubuntu-latest
    needs: check-repository
    if: >-
      needs.check-repository.outputs.is-upstream == 'true'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.action != 'closed'
          && github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      # workflow_dispatch carries no pull_request context, so the fork check the
      # pull_request trigger gets for free (head.repo.full_name == github.repository)
      # has to be re-verified via the API before anything is checked out - this job
      # runs with EXPO_TOKEN/GITHUB_TOKEN and deploys to public GitHub Pages, so a
      # manually-dispatched run must never build a fork's code.
      - name: "🔒 Verify PR head repository (manual dispatch only)"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')
          echo "PR #${PR_NUMBER} head repository: ${HEAD_REPO}"
          if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "::error::Refusing to build PR #${PR_NUMBER} - its head branch is on a fork (${HEAD_REPO}), not ${{ github.repository }}."
            exit 1
          fi

      - name: "🔄 Checkout PR Head"
        uses: actions/checkout@v4
        with:
          # workflow_dispatch has no pull_request.head.ref, but any PR's head
          # commit can be checked out directly via the refs/pull/<n>/head ref
          # (the step above already confirmed this PR's head lives in this repo).
          ref: ${{ github.event.pull_request.head.ref || format('refs/pull/{0}/head', inputs.pr_number) }}

      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🗂️ Resolve web base path from customer config"
        run: |
          WEB_BASE_PATH=$(node - <<'EOF'
          require('ts-node').register({
            transpileOnly: true,
            compilerOptions: { module: 'Node16', moduleResolution: 'node16' },
          });
          const { getCustomerConfig } = require('./config.ts');
          console.log(getCustomerConfig().baseUrl.replace(/^\//, ''));
          EOF
          )
          echo "WEB_BASE_PATH=${WEB_BASE_PATH}" >> "$GITHUB_ENV"
        working-directory: ./apps/frontend/app

      - name: "👤 Git User Configuration"
        run: |
          git config --global user.name 'Rocket Meals'
          git config --global user.email 'nils@baumgartner-software.de'
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔨 Build & Deploy Web Preview"
        run: |
          yarn expo export -p web
          yarn run copy-assets
          node ./scripts/deploy-gh-pages.js --dest "pr-${PR_NUMBER}"
        working-directory: ./apps/frontend/app
        env:
          EXPO_PUBLIC_BASE_URL_SUFFIX: /pr-${{ env.PR_NUMBER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "💬 Comment on PR"
        uses: actions/github-script@v7
        env:
          WEB_BASE_PATH: ${{ env.WEB_BASE_PATH }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- web-preview-comment -->';
            const baseUrlPath = process.env.WEB_BASE_PATH;
            const url = `https://rocket-meals.de/${baseUrlPath}/pr-${prNumber}/`;

            const body = [
              marker,
              '## 🌐 Web Preview',
              '',
              `A web preview for this PR has been deployed:`,
              '',
              `**🌍 Preview:** [${url}](${url})`,
              '',
              '> ℹ️ The preview is rebuilt on every push to this PR and removed when the PR is closed or merged.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Updated existing comment #${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log(`Created comment #${created.id}`);
            }

  expo-preview-cleanup:
    name: "🗑️ EAS Preview Cleanup (PR #${{ github.event.pull_request.number }})"
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🗑️ Delete EAS branch – Frontend App"
        continue-on-error: true
        run: eas branch:delete "pr-${{ github.event.pull_request.number }}" --non-interactive
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🗑️ Delete EAS branch – Geonexia"
        continue-on-error: true
        run: eas branch:delete "pr-${{ github.event.pull_request.number }}" --non-interactive
        working-directory: ./apps/geonexia/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🗑️ Delete EAS branch – Score Tracker"
        continue-on-error: true
        run: eas branch:delete "pr-${{ github.event.pull_request.number }}" --non-interactive
        working-directory: ./apps/score-tracker/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🗑️ Delete Web Preview from gh-pages"
        continue-on-error: true
        run: |
          git clone --depth 1 "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" -b gh-pages /tmp/gh-pages-cleanup
          cd /tmp/gh-pages-cleanup
          git config user.name 'Rocket Meals'
          git config user.email 'nils@baumgartner-software.de'
          PR_NUMBER="${{ github.event.pull_request.number }}"
          DIR="pr-${PR_NUMBER}"
          if [ -d "$DIR" ]; then
            git rm -rf "$DIR"
            git commit -m "chore: remove web preview for PR #${PR_NUMBER}"
            git push
          else
            echo "No web preview directory found to remove"
          fi
        working-directory: ./apps/frontend/app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
