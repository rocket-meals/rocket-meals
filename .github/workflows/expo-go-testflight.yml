name: "🧪 Expo Go Client → TestFlight"

# Baut mit `eas go` einen eigenen Expo-Go-Client für eine wählbare SDK-Version
# und schiebt ihn in das interne TestFlight-Team. Hintergrund: Die App-Store-
# Version von Expo Go hängt auf SDK 54 fest (Apple-Review), neuere SDKs sind
# dort nicht verfügbar. `eas go` legt dafür eine eigene App unter unserem
# Apple-Team in App Store Connect an (eigene Bundle-ID) - unabhängig von der
# offiziellen Expo-Go-App.
#
# Der Build läuft auf EAS-Servern und zählt als Workflow-Minuten, nicht gegen
# die EAS-Build-Quota. Ein erneuter Lauf mit derselben Bundle-ID aktualisiert
# die bestehende App in App Store Connect, statt eine neue anzulegen.
#
# Wichtig: `eas go` funktioniert NICHT mit Robot-Tokens ("This action is not
# supported for robot users") - das übliche EXPO_TOKEN-Secret (Robot
# "GitHubActions") reicht daher nicht. Es braucht das Secret
# EXPO_PERSONAL_TOKEN mit einem persönlichen Access Token eines echten
# Expo-Accounts: expo.dev → eigener User-Account (nicht die Organisation) →
# Access tokens → "Create token".
#
# Apple-Login: `eas go` erzwingt eine ECHTE Apple-User-Session
# (ensureUserAuthenticatedAsync) - es legt die App in App Store Connect an und
# erstellt Push Keys, was mit dem App-Store-Connect-API-Key nicht geht. Der
# ASC-API-Key (prepare-asc-api-key) wird trotzdem gebraucht (Submission).
# Apple-Accounts haben Pflicht-2FA, ein Passwort-Login im CI ist daher
# unmöglich. Stattdessen wird eine lokal erzeugte Session per Cookie-Secret
# wiederverwendet - @expo/apple-utils liest sie aus EXPO_APP_STORE_COOKIES_JSON:
#
#   1. Lokal einloggen (Apple ID + 2FA) und Session exportieren:
#        npx -y @expo/apple-utils@latest login --export
#      Der Befehl druckt u.a.:
#        export EXPO_APP_STORE_COOKIES_JSON="{...}"
#   2. Den JSON-Wert (ohne die umschließenden Anführungszeichen) als
#      Repo-Secret EXPO_APPLE_APP_STORE_COOKIES_JSON hinterlegen.
#   3. Die Apple-ID-E-Mail als Repo-Secret EXPO_APPLE_ID hinterlegen
#      (ohne sie fragt die CLI interaktiv nach dem Apple-Account).
#
# Die Apple-Session läuft nach ca. 30 Tagen ab (wie fastlane spaceauth).
# Schlägt der Lauf dann wieder mit "Input is required, but stdin is not
# readable" fehl, Schritt 1+2 wiederholen und das Secret aktualisieren.

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Expo SDK Version (Dropdown); "latest" = neueste von EAS unterstützte'
        required: true
        type: choice
        default: '57'
        options:
          - '57'
          - '56'
          - '55'
          - '54'
          - 'latest'
      sdk_version_custom:
        description: 'Expo SDK Version (Freitext, z.B. 58) - übersteuert das Dropdown, falls gesetzt'
        required: false
        default: ''
      app_name:
        description: 'App-Name in App Store Connect / TestFlight'
        required: false
        default: 'Baumgartner Expo Go'
      bundle_id:
        description: 'iOS Bundle-ID (stabil lassen, damit Läufe dieselbe App aktualisieren); leer = von EAS generiert'
        required: false
        default: 'de.baumgartner-software.expo-go'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-expo-go:
    name: "🚀 Build Expo Go SDK ${{ github.event.inputs.sdk_version_custom || github.event.inputs.sdk_version }} & submit to TestFlight"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Nur im Upstream-Repository ausführen - Tenant-Forks sollen keinen
    # eigenen Expo-Go-Client bauen (gleiche Absicht wie check-repository in ci.yml).
    if: github.repository == 'rocket-meals/rocket-meals'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4

      # Forks (Tenant-Repositories) haben die Secrets ggf. nicht konfiguriert -
      # dann sauber überspringen statt fehlschlagen (gleiches Muster wie in den
      # ios-submit-review-Workflows).
      - name: "🔐 Check EAS & App Store Connect credentials"
        id: guard
        env:
          EXPO_PERSONAL_TOKEN: ${{ secrets.EXPO_PERSONAL_TOKEN }}
          ASC_KEY: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          APPLE_COOKIES: ${{ secrets.EXPO_APPLE_APP_STORE_COOKIES_JSON }}
        run: |
          if [ -z "$EXPO_PERSONAL_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Secret EXPO_PERSONAL_TOKEN ist nicht gesetzt - Workflow wird übersprungen."
            echo "ℹ️ 'eas go' unterstützt keine Robot-Tokens (wie EXPO_TOKEN). Bitte auf expo.dev"
            echo "   im eigenen User-Account (nicht der Organisation) unter 'Access tokens' einen"
            echo "   Token erstellen und als Repo-Secret EXPO_PERSONAL_TOKEN hinterlegen."
          elif [ -z "$ASC_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Secret EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT ist nicht gesetzt - Workflow wird übersprungen."
          elif [ -z "$APPLE_ID" ] || [ -z "$APPLE_COOKIES" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Secrets EXPO_APPLE_ID und/oder EXPO_APPLE_APP_STORE_COOKIES_JSON fehlen - Workflow wird übersprungen."
            echo "ℹ️ 'eas go' braucht eine echte Apple-User-Session (der ASC-API-Key reicht nicht,"
            echo "   da die App in App Store Connect angelegt und ein Push Key erstellt wird)."
            echo "   Wegen Apple-2FA ist ein Passwort-Login im CI unmöglich. Einmalig lokal:"
            echo "     npx -y @expo/apple-utils@latest login --export"
            echo "   Danach den gedruckten EXPO_APP_STORE_COOKIES_JSON-Wert als Repo-Secret"
            echo "   EXPO_APPLE_APP_STORE_COOKIES_JSON und die Apple-ID-E-Mail als Repo-Secret"
            echo "   EXPO_APPLE_ID hinterlegen. Die Session hält ca. 30 Tage."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "⚙️ Setup Node.js"
        if: steps.guard.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: "⚙️ Enable Corepack for Yarn v2"
        if: steps.guard.outputs.available == 'true'
        run: corepack enable

      # prepare-asc-api-key braucht ts-node aus den Workspace-Dependencies;
      # --mode=skip-build lässt Lifecycle-Skripte aus (Supply-Chain-Härtung).
      - name: "📦 Install dependencies"
        if: steps.guard.outputs.available == 'true'
        run: yarn install --immutable --mode=skip-build

      # Schreibt den .p8-Key auf Platte und exportiert EXPO_ASC_API_KEY_PATH,
      # EXPO_ASC_KEY_ID, EXPO_ASC_ISSUER_ID, EXPO_APPLE_TEAM_ID und
      # EXPO_APPLE_TEAM_TYPE - die EAS CLI liest diese Variablen für die
      # nicht-interaktive TestFlight-Submission.
      - name: "🔐 Prepare Apple App Store Connect API key"
        if: steps.guard.outputs.available == 'true'
        uses: ./.github/actions/prepare-asc-api-key
        with:
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}

      - name: "🚀 Build & submit Expo Go via eas go"
        if: steps.guard.outputs.available == 'true'
        env:
          # Persönlicher Token statt Robot-Token - 'eas go' bricht mit
          # "This action is not supported for robot users" ab.
          EXPO_TOKEN: ${{ secrets.EXPO_PERSONAL_TOKEN }}
          # Apple-User-Auth ohne Prompt: Apple-ID + lokal exportierte Session-
          # Cookies (siehe Kommentar am Dateianfang). @expo/apple-utils stellt
          # die Session aus EXPO_APP_STORE_COOKIES_JSON wieder her - dadurch
          # entfallen Passwort-Eingabe und 2FA-Prompt, die im CI unmöglich sind.
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APP_STORE_COOKIES_JSON: ${{ secrets.EXPO_APPLE_APP_STORE_COOKIES_JSON }}
          # Kein OS-Keychain im CI-Runner - verhindert Keychain-Zugriffe beim
          # Cachen von Apple-Credentials.
          EXPO_NO_KEYCHAIN: "1"
          # Freitext übersteuert das Dropdown; 'latest' bedeutet: kein
          # --sdk-version-Flag, EAS nimmt die neueste unterstützte Version.
          SDK_VERSION: ${{ github.event.inputs.sdk_version_custom || github.event.inputs.sdk_version }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$SDK_VERSION" ] && [ "$SDK_VERSION" != "latest" ]; then
            ARGS+=(--sdk-version "$SDK_VERSION")
          fi
          if [ -n "$APP_NAME" ]; then
            ARGS+=(--name "$APP_NAME")
          fi
          if [ -n "$BUNDLE_ID" ]; then
            ARGS+=(--bundle-id "$BUNDLE_ID")
          fi
          echo "▶️ npx eas-cli go ${ARGS[*]}"
          npx --yes eas-cli@latest go "${ARGS[@]}"

      - name: "🖨️ Summary"
        if: steps.guard.outputs.available == 'true'
        env:
          SDK_VERSION: ${{ github.event.inputs.sdk_version_custom || github.event.inputs.sdk_version }}
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          {
            echo "## 🧪 Expo Go Client → TestFlight"
            echo ""
            echo "- **SDK-Version:** ${SDK_VERSION:-latest}"
            echo "- **App:** ${APP_NAME}"
            echo ""
            echo "Der Build wurde an App Store Connect übermittelt. Sobald Apple ihn"
            echo "verarbeitet hat, erscheint er im **internen TestFlight-Team** und kann"
            echo "auf iPhones installiert werden."
          } >> "$GITHUB_STEP_SUMMARY"
