name: "♿ Accessibility Audit"

on:
  workflow_dispatch: # Allow manual triggering
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility-audit:
    name: "♿ Run axe-core audit on all screens"
    # Only run on the main repository, not on forks (forks lack secrets and
    # should not have report commits pushed by this workflow)
    if: github.repository == 'rocket-meals/rocket-meals'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🏗️ Export Expo Web (dev build)"
        run: yarn export:web:dev
        working-directory: apps/frontend/app

      - name: "🌐 Serve exported web app"
        run: |
          mkdir -p /tmp/webroot/rocket-meals
          cp -r apps/frontend/app/dist/* /tmp/webroot/rocket-meals/
          # Unknown paths (the not-found screen and dynamic routes like housing-analytics/[report])
          # get the app shell, the client router then renders the right screen
          cp apps/frontend/app/dist/+not-found.html /tmp/webroot/404.html
          # serve maps clean URLs like /login to login.html (python's http.server
          # answered those with a 404 page, which was then audited instead of the screen)
          npx --yes serve@14.2.4 -l 8081 /tmp/webroot &
          echo "Web server started on port 8081"
          # Wait until the server is ready
          for i in {1..15}; do
            if curl -sf http://localhost:8081/rocket-meals/ > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: "♿ Run accessibility audit"
        run: yarn start --baseUrl http://localhost:8081/rocket-meals --reportDir "$GITHUB_WORKSPACE/reports/accessibility"
        working-directory: apps/accessibilityTester

      - name: "📤 Upload reports as workflow artifact"
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: reports/accessibility/

      - name: "💾 Stage reports"
        uses: ./.github/actions/stage-changes
        with:
          name: accessibility-report
          paths: reports/accessibility
          description: "update accessibility reports"

  # Single writer to the branch: the job above only uploads its reports as a
  # patch artifact, this job applies it and pushes it with a rebase-retry so a
  # concurrent CI push cannot make it fail.
  publish-staged-changes:
    name: "📤 Publish Staged Changes"
    runs-on: ubuntu-latest
    needs: [accessibility-audit]
    if: always() && github.repository == 'rocket-meals/rocket-meals'
    permissions:
      contents: write
      actions: read
    steps:
      # fetch-depth: 0 is required - `git apply --3way` needs the blobs the
      # staged patches were built against.
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "📤 Apply and push all staged changes"
        uses: ./.github/actions/publish-staged-changes
        with:
          branch: ${{ github.ref_name }}
          commit-message: "chore: update accessibility reports [skip ci]"
