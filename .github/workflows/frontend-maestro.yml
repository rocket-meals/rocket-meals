name: "🎭 Maestro Web E2E Tests"

on:
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-web:
    name: "🎭 Maestro Web Smoke Test"
    runs-on: ubuntu-latest
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🏗️ Export Expo Web (dev build for E2E tests)"
        run: EXPO_WEB_BASE_URL= yarn export:web:dev
        working-directory: apps/frontend/app

      - name: "🌐 Serve exported web app"
        run: |
          mkdir -p /tmp/webroot
          cp -r apps/frontend/app/dist/* /tmp/webroot/
          python3 -m http.server 8081 --directory /tmp/webroot &
          echo "Web server started on port 8081"
          # Wait until the server is ready
          for i in {1..15}; do
            if curl -sf http://localhost:8081/ > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: "🌐 Install Chrome"
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: "🎭 Install Maestro CLI"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: "📝 Generate Maestro YAML from TypeScript tests"
        run: yarn maestro:generate
        working-directory: apps/frontend/app

      - name: "▶️ Run Maestro tests"
        run: |
          mkdir -p /tmp/maestro-screenshots
          maestro test apps/frontend/maestro-tests/generated/ --platform web --headless --debug-output /tmp/maestro-debug --output /tmp/maestro-screenshots
        env:
          APP_URL: "http://localhost:8081/"

      - name: "📂 List screenshot locations"
        if: always()
        run: |
          echo "=== ~/.maestro/tests/ ==="
          find "$HOME/.maestro/tests/" -type f -name "*.png" 2>/dev/null || echo "No files found"
          echo ""
          echo "=== /tmp/maestro-debug/ ==="
          find /tmp/maestro-debug/ -type f -name "*.png" 2>/dev/null || echo "No files found"
          echo ""
          echo "=== /tmp/maestro-screenshots/ ==="
          find /tmp/maestro-screenshots/ -type f -name "*.png" 2>/dev/null || echo "No files found"

      - name: "📸 Show failure screenshots in summary"
        if: failure()
        shell: bash
        run: |
          echo "## 🎭 Maestro Test Failure Screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          shopt -s globstar nullglob
          files=("$HOME"/.maestro/tests/**/*.png /tmp/maestro-debug/**/*.png /tmp/maestro-screenshots/**/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No failure screenshots found." >> "$GITHUB_STEP_SUMMARY"
          else
            for img in "${files[@]}"; do
              [ -f "$img" ] || continue
              name=$(basename "$img")
              echo "### $name" >> "$GITHUB_STEP_SUMMARY"
              echo "![${name}](data:image/png;base64,$(base64 -w 0 < "$img"))" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: "🖼️ Show preview screenshot in summary"
        if: always()
        shell: bash
        run: |
          echo "## 🖼️ Maestro Screenshot Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          shopt -s globstar nullglob
          files=("$HOME"/.maestro/tests/**/*.png /tmp/maestro-debug/**/*.png /tmp/maestro-screenshots/**/*.png)
          shown=false
          for img in "${files[@]}"; do
            [ -f "$img" ] || continue
            name=$(basename "$img")
            echo "### $name" >> "$GITHUB_STEP_SUMMARY"
            echo "![${name}](data:image/png;base64,$(base64 -w 0 < "$img"))" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            shown=true
            break
          done
          if [ "$shown" = false ]; then
            echo "No screenshots found." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_All screenshots are available in the **maestro-screenshots** artifact above._" >> "$GITHUB_STEP_SUMMARY"

      - name: "📸 Collect screenshots for upload"
        if: always()
        run: |
          mkdir -p /tmp/maestro-screenshots
          find "$HOME/.maestro/tests/" -type f -name "*.png" -exec cp {} /tmp/maestro-screenshots/ \; 2>/dev/null || true
          find /tmp/maestro-debug/ -type f -name "*.png" -exec cp {} /tmp/maestro-screenshots/ \; 2>/dev/null || true
          find . -maxdepth 1 -type f -name "*.png" -exec cp {} /tmp/maestro-screenshots/ \; 2>/dev/null || true
          echo "Collected screenshots:"
          ls -la /tmp/maestro-screenshots/ 2>/dev/null || echo "No screenshots collected"

      - name: "📸 Upload screenshots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: /tmp/maestro-screenshots/
          if-no-files-found: warn
          retention-days: 30
