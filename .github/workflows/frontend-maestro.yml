name: "🎭 Maestro Web E2E Tests"

on:
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-web:
    name: "🎭 Maestro Web Smoke Test"
    runs-on: ubuntu-latest
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🏗️ Export Expo Web (dev build for E2E tests)"
        run: yarn export:web:dev
        working-directory: apps/frontend/app

      - name: "🌐 Serve exported web app"
        run: |
          mkdir -p /tmp/webroot/rocket-meals
          cp -r apps/frontend/app/dist/* /tmp/webroot/rocket-meals/
          python3 -m http.server 8081 --directory /tmp/webroot &
          echo "Web server started on port 8081"
          # Wait until the server is ready
          for i in {1..15}; do
            if curl -sf http://localhost:8081/rocket-meals/ > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: "🌐 Install Chrome"
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: "🎭 Install Maestro CLI"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: "📝 Generate Maestro YAML from TypeScript tests"
        run: yarn maestro:generate
        working-directory: apps/frontend/app

      - name: "▶️ Run Maestro tests"
        run: maestro test apps/frontend/maestro-tests/generated/ --platform web --headless
        env:
          APP_URL: "http://localhost:8081/rocket-meals/"
