name: 🔄 Fork Synchronization

permissions:
  contents: write

on:
  # Run hourly
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00. 

  # Allow manual triggering
  workflow_dispatch:

jobs:
  sync-fork:
    name: 🔄 Sync Fork with Upstream
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check Repository Type
        id: check-repo
        uses: ./.github/actions/check-repository

      - name: 🔍 Check for Updates from Upstream
        id: check-updates
        if: steps.check-repo.outputs.is-fork == 'true'
        run: |
          # Fetch upstream repository
          git remote add upstream https://github.com/rocket-meals/rocket-meals.git || true
          git fetch upstream master

          # Count commits in upstream that are NOT yet in our branch.
          # Using rev-list range (not HEAD comparison) so diverged forks with their own
          # commits are handled correctly — those extra local commits must not falsely
          # trigger a "has updates" result.
          UPSTREAM_AHEAD=$(git rev-list HEAD..upstream/master --count)

          echo "Commits in upstream not in local branch: $UPSTREAM_AHEAD"

          if [ "$UPSTREAM_AHEAD" -gt 0 ]; then
            echo "Updates available from upstream ($UPSTREAM_AHEAD new commits)"
            echo "has-updates=true" >> $GITHUB_OUTPUT
          else
            echo "No updates available"
            echo "has-updates=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔄 Sync Fork with Upstream
        id: sync-result
        if: steps.check-repo.outputs.is-fork == 'true' && steps.check-updates.outputs.has-updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          REPO_FULL_NAME="${{ steps.check-repo.outputs.repository-name }}"
          echo "Syncing fork: $REPO_FULL_NAME"
          echo "Upstream repository: rocket-meals/rocket-meals"
          echo "Target branch: master"

          # Configure git identity for the merge commit.
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          # Merge upstream changes into the local branch.
          # gh repo sync only supports fast-forward merges and therefore always fails for
          # forks that intentionally diverge (e.g. tenant-specific getCustomerConfig()).
          # Using git merge preserves fork-specific commits while still pulling in upstream
          # changes. Conflicts cause a non-zero exit and must be resolved manually.
          if git merge upstream/master --no-edit -m "chore: sync upstream changes"; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO_FULL_NAME}.git" HEAD:master
            echo "✅ Fork synchronization completed successfully!"
            echo "sync-success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Fork synchronization failed (merge conflicts or push error)!"
            echo "sync-success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 🚀 Trigger Combined CI
        if: steps.check-repo.outputs.is-fork == 'true' && steps.sync-result.outputs.sync-success == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          REPO_FULL_NAME="${{ steps.check-repo.outputs.repository-name }}"
          echo "🚀 Triggering Combined CI workflow after successful sync..."
          gh workflow run ci.yml --ref master --repo "$REPO_FULL_NAME"
          echo "✅ Combined CI workflow triggered!"

      - name: ⏭️ Skip Fork Sync - No Updates
        if: steps.check-repo.outputs.is-fork == 'true' && steps.check-updates.outputs.has-updates == 'false'
        run: |
          echo "⏭️ No updates available from upstream - skipping sync."

      - name: ⏭️ Skip Fork Sync - Upstream Repository
        if: steps.check-repo.outputs.is-fork == 'false'
        run: |
          echo "⏭️ Skipping fork synchronization - this is the upstream repository."
