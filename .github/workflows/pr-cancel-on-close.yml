name: "🛑 Cancel PR Workflows on Merge/Close"

# When a PR is merged, the resulting master push starts the real CI - every run
# still going for the PR head is redundant from that moment on (it builds the
# same commit content a second time, burns EAS build minutes and finishes long
# after the master run).
#
# The per-workflow `concurrency` groups cannot express this: a PR run is keyed
# on the PR number and the master run on `refs/heads/master`, so they never
# cancel each other. Only `pr-expo-preview` gets away with it, because it
# handles the `closed` event itself and therefore lands in its own PR group.
#
# So this workflow cancels those runs centrally - which also covers every PR
# workflow added later without having to touch it.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: "🛑 Cancel runs for the closed PR"
    runs-on: ubuntu-latest
    if: github.repository == 'rocket-meals/rocket-meals'
    steps:
      - name: "🛑 Cancel queued and running PR workflow runs"
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            core.info(
              `PR #${pr.number} (${pr.merged ? 'merged' : 'closed without merge'}), ` +
              `head branch '${pr.head.ref}' @ ${pr.head.sha}`,
            );

            const runs = [];
            for (const status of ['queued', 'in_progress']) {
              runs.push(...await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  status,
                  per_page: 100,
                },
              ));
            }

            // Only `pull_request` runs are cancelled. That deliberately spares:
            //   - the master CI run started by the merge (event `push`),
            //   - `pull_request_target` runs, which are the ones that clean up
            //     after a closed PR (pr-expo-preview removes its web preview
            //     there) - cancelling those would leave the preview behind,
            //   - this very run.
            // `pull_requests` is empty for runs from forked branches, so it is
            // only used as an extra guard when GitHub actually filled it in.
            const cancellable = runs.filter((run) =>
              run.id !== context.runId &&
              run.event === 'pull_request' &&
              run.head_branch === pr.head.ref &&
              (run.pull_requests.length === 0 ||
                run.pull_requests.some((p) => p.number === pr.number))
            );

            if (cancellable.length === 0) {
              core.info('No queued or running PR workflow runs left to cancel.');
              return;
            }

            for (const run of cancellable) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                core.info(`Cancelled "${run.name}" (run ${run.id}, ${run.status}).`);
              } catch (error) {
                // 409 = the run finished between listing and cancelling.
                if (error.status === 409) {
                  core.info(`"${run.name}" (run ${run.id}) already finished.`);
                } else {
                  core.warning(`Could not cancel "${run.name}" (run ${run.id}): ${error.message}`);
                }
              }
            }
