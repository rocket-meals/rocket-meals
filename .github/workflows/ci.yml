name: "🚀 CI"

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-repository:
    name: "🔍 Check Repository"
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      is-upstream: ${{ steps.check.outputs.is-upstream }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Check Repository Type"
        id: check
        uses: ./.github/actions/check-repository

  detect-changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend-changed }}
      geonexia-changed: ${{ steps.changes.outputs.geonexia-changed }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "🔍 Check for path changes"
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: running all jobs"
            echo "frontend-changed=true" >> $GITHUB_OUTPUT
            echo "geonexia-changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit available, running all jobs"
            echo "frontend-changed=true" >> $GITHUB_OUTPUT
            echo "geonexia-changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check frontend changes
          if echo "$CHANGED_FILES" | grep -qE '^(apps/frontend/|packages/common/|packages/common-ui/|package\.json$|yarn\.lock$)'; then
            echo "frontend-changed=true" >> $GITHUB_OUTPUT
            echo "Frontend changes detected"
          else
            echo "frontend-changed=false" >> $GITHUB_OUTPUT
            echo "No frontend changes detected"
          fi

          # Check geonexia changes
          if echo "$CHANGED_FILES" | grep -qE '^(apps/geonexia/|packages/common/|packages/common-ui/|package\.json$|yarn\.lock$)'; then
            echo "geonexia-changed=true" >> $GITHUB_OUTPUT
            echo "Geonexia changes detected"
          else
            echo "geonexia-changed=false" >> $GITHUB_OUTPUT
            echo "No geonexia changes detected"
          fi

  check-build:
    name: "🔍 Check Build Number"
    runs-on: ubuntu-latest
    needs: check-repository
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Compare Build Number"
        id: check
        uses: ./.github/actions/check-build-number

