name: "🚀 CI"

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      # Deprecated: build numbers are now compared against EAS online instead of
      # git history. Kept so sync-fork dispatches from not-yet-synced forks that
      # still pass this input do not fail.
      previous_commit_sha:
        description: 'Deprecated - no longer used (build numbers are compared against EAS online)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-repository:
    name: "🔍 Check Repository"
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      is-upstream: ${{ steps.check.outputs.is-upstream }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Check Repository Type"
        id: check
        uses: ./.github/actions/check-repository

  # Instead of diffing config.ts in git history (unreliable after force pushes,
  # fork syncs or failed builds), ask EAS which build number is actually online
  # per platform and only build when the local build number is higher.
  check-build-android:
    name: "🔍 Check Android Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare Android Build Number against EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/frontend/app
          platform: android

  check-build-ios:
    name: "🔍 Check iOS Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare iOS Build Number against EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/frontend/app
          platform: ios

