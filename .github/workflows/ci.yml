        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Score Tracker Android Preview APK & update README"
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/score-tracker/frontend
          eas-profile: preview
          app-key: score-tracker
          app-label: "Score Tracker"
          update-readme: 'true'

      - name: "💾 Commit README update"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Score Tracker Android preview APK link in README [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-und-jahr-check-build:
    name: "🔍 Tag und Jahr Check iOS Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare Tag und Jahr iOS Build Number against EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/tag-und-jahr/frontend
          platform: ios

  tag-und-jahr-build-ios:
    name: "📦 Tag und Jahr Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
    needs: [tag-und-jahr-check-build, check-repository]
    if: needs.tag-und-jahr-check-build.outputs.should-build == 'true' && needs.check-repository.outputs.is-upstream == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      # eas build --non-interactive cannot bootstrap credentials for a new app
      # ("Credentials are not set up. Run this command again in interactive
      # mode.") - this creates/validates them headless first, using the ASC API
      # key exported by setup-and-install (prepare-asc-api-key).
      - name: "🔐 Ensure Tag und Jahr iOS build credentials"
        uses: ./.github/actions/eas-ios-build-credentials
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/tag-und-jahr/frontend
          # The App Group must exist and be assigned to both bundle ids (one-time
          # manual portal step, see apps/tag-und-jahr/README.md) - verified here
          # so a missing assignment fails fast instead of deep in the Xcode build.
          verify-app-group: group.de.baumgartner-software.day-and-year
          verify-bundle-ids: de.baumgartner-software.day-and-year,de.baumgartner-software.day-and-year.ExpoWidgetsTarget
      # --auto-submit cannot link an App Store Connect API key to a new app in
      # non-interactive mode ("App Store Connect API Keys cannot be set up in
      # --non-interactive mode"). The submit profile therefore references the
      # key locally (ascApiKeyPath/-Id/-IssuerId in eas.json); this step places
      # the .p8 written by prepare-asc-api-key at that path. The file is
      # gitignored (*.p8).
      - name: "🔑 Provide ASC API key for auto-submit"
        run: cp "$EXPO_ASC_API_KEY_PATH" ./apps/tag-und-jahr/frontend/asc-api-key.p8
      - name: "🛠️ Build and Submit Tag und Jahr iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/tag-und-jahr/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  tag-und-jahr-expo-update:
    name: "🕰️ Tag und Jahr EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🚀 Publish Tag und Jahr OTA update"
        uses: ./.github/actions/tag-und-jahr-expo-update
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref_name: ${{ github.ref_name }}

  # Only master@rocket-meals/rocket-meals builds the Tag und Jahr preview APK
  # and gets the README link - forks and other branches must not push commits
  # upstream nor advertise a preview APK from an unverified fork build.
  tag-und-jahr-build-android-preview:
    name: "🧪 Tag und Jahr Build Android Preview APK"
    runs-on: ubuntu-latest
    needs: [tag-und-jahr-check-build, check-repository]
    if: needs.tag-und-jahr-check-build.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Tag und Jahr Android Preview APK & update README"
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/tag-und-jahr/frontend
          eas-profile: preview
          app-key: tag-und-jahr
          app-label: "Tag und Jahr"
          update-readme: 'true'

      - name: "💾 Commit README update"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Tag und Jahr Android preview APK link in README [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-gh-pages:
    name: "🌍 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
#    needs: sonarcloud-report
    needs: [check-repository]
    if: github.ref_name == 'master'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "👤 Git User Configuration"
        run: |
          git config --global user.name 'Rocket Meals'
          git config --global user.email 'nils@baumgartner-software.de'
      - name: "🚀 Deploy to GitHub Pages"
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          CI=false yarn deploy:gh:pages
        working-directory: ./apps/frontend/app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

