  sonarqube:
    name: "🔍 SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: [check-repository]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: "🔄 Checkout Repository"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: "🔍 SonarQube Scan"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonarcloud-report:
    name: "📥 Download SonarCloud Report"
    runs-on: ubuntu-latest
    needs: [sonarqube, data-clumps-report, check-repository]
    continue-on-error: true
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "📥 Download SonarCloud reports"
        run: |
          SONAR_PROJECT=$(grep -E '^sonar.projectKey' sonar-project.properties | cut -d= -f2)
          yarn workspace sonarCloudReportDownloader start --token "$SONAR_TOKEN" --project "$SONAR_PROJECT"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: "📝 Generate issue markdown"
        run: |
          yarn workspace sonarCloudReportDownloader generate-issue
      - name: "🐛 Create GitHub issue (close old ones first)"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issuePath = 'reports/sonarCloud/issue.md';
            if (!fs.existsSync(issuePath)) {
              console.log('No issue markdown generated, skipping issue creation');
              return;
            }
            const body = fs.readFileSync(issuePath, 'utf-8');
            const title = '📊 SonarCloud Issues Report';
            const labels = ['sonarcloud'];

            // Close all existing open issues with the sonarcloud label
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed old issue #${issue.number}: ${issue.title}`);
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labels,
            });
            console.log(`Created issue #${created.number}`);
      - name: "💾 Commit reports"
        uses: ./.github/actions/commit-and-push-files
        with:
          files: reports/sonarCloud
          commit-message: "chore: update sonarcloud reports [skip ci]"

  data-clumps-report:
    name: "🩺 Analyse Data Clumps"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🗑️ Close old data clumps issues"
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const oldIssues = issues.filter(i => i.title.startsWith('chore: Refactor data clumps'));
            for (const issue of oldIssues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed old issue #${issue.number}: ${issue.title}`);
            }
      - name: "🩺 Analyse data clumps"
        id: data-clumps
        uses: NilsBaumgartner1994/data-clumps-doctor/.github/actions/analyse-data-clumps@master
        with:
          path-to-source: .
          output-path: reports/data-clumps-doctor/data-clumps.json
          badge-output-path: reports/data-clumps-doctor/badges/data-clumps.svg
          source-language-type: typescript
          generate-issue: 'true'
          only-update-if-changes: 'false'
          refactor-amount: 15
          detector-options-paths-ignored-in-detection-comparison: '**/databaseTypes/types.ts'
      - name: "💾 Commit reports"
        uses: ./.github/actions/commit-and-push-files
        with:
          files: reports/data-clumps-doctor/data-clumps.json reports/data-clumps-doctor/badges/data-clumps.svg
          commit-message: "chore: update data-clumps reports [skip ci]"

  backend-directus:
    name: "🔨 Directus Backend Build"
    runs-on: ubuntu-latest
#    needs: sonarcloud-report
    needs: [check-build, check-repository]
    steps:
      - name: "🏗 Setup repo"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: "🚀 Build backend"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
        uses: ./.github/actions/backend-build
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  expo-update:
    name: "🏗 EAS Update Production"
    runs-on: ubuntu-latest
    #    needs: sonarcloud-report
    needs: [check-build, check-repository]
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🚀 Publish update"
        run: eas update --auto --platform all --non-interactive --channel production
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-android:
    name: "📦 Build & 🚀 Submit Android App"
    runs-on: ubuntu-latest
#    needs: [sonarcloud-report, check-build]
    needs: [check-build, check-repository]
    if: needs.check-build.outputs.changed == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🛠️ Build and Submit Android App"
        run: eas build --platform android --non-interactive --profile production --auto-submit
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-android-preview:
    name: "🧪 Build Android Preview APK"
    runs-on: ubuntu-latest
#    needs: [sonarcloud-report, check-build]
    needs: [check-build, check-repository]
    if: needs.check-build.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Only master@rocket-meals/rocket-meals gets the README link - forks and
      # other branches build previews too, but must not push commits upstream
      # nor advertise a preview APK from an unverified fork build.
      - name: "🧪 Build Android Preview APK & update README"
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/frontend/app
          app-key: frontend
          app-label: "Rocket Meals (Frontend)"
          update-readme: ${{ (github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true') && 'true' || 'false' }}

      - name: "💾 Commit README update"
        if: github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
        uses: ./.github/actions/commit-and-push-files
        with:
          files: README.md
          commit-message: "chore: update Android preview APK link in README [skip ci]"

  build-ios:
    name: "📦 Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
#    needs: [sonarcloud-report, check-build]
    needs: [check-build, check-repository]
    if: needs.check-build.outputs.changed == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      - name: "🛠️ Build and Submit iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  geonexia-check-build:
    name: "🔍 Geonexia Check Build Number"
    runs-on: ubuntu-latest
    needs: check-repository
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Compare Geonexia Build Number"
        id: check
        uses: ./.github/actions/check-build-number
        with:
          working-directory: apps/geonexia/frontend
          previous-commit-sha: ${{ github.event.inputs.previous_commit_sha }}

  geonexia-build-ios:
    name: "📦 Geonexia Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
    needs: [geonexia-check-build, check-repository]
    if: needs.geonexia-check-build.outputs.changed == 'true' && needs.check-repository.outputs.is-upstream == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      - name: "🛠️ Build and Submit Geonexia iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/geonexia/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  geonexia-expo-update:
    name: "🌍 Geonexia EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🚀 Publish Geonexia OTA update"
        uses: ./.github/actions/geonexia-expo-update
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref_name: ${{ github.ref_name }}

  score-tracker-check-build:
    name: "🔍 Score Tracker Check Build Number"
    runs-on: ubuntu-latest
    needs: check-repository
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Compare Score Tracker Build Number"
        id: check
        uses: ./.github/actions/check-build-number
        with:
          working-directory: apps/score-tracker/frontend
          previous-commit-sha: ${{ github.event.inputs.previous_commit_sha }}

  score-tracker-build-ios:
    name: "📦 Score Tracker Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
    needs: [score-tracker-check-build, check-repository]
    if: needs.score-tracker-check-build.outputs.changed == 'true' && needs.check-repository.outputs.is-upstream == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      - name: "🛠️ Build and Submit Score Tracker iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/score-tracker/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  score-tracker-expo-update:
    name: "🎯 Score Tracker EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🚀 Publish Score Tracker OTA update"
        uses: ./.github/actions/score-tracker-expo-update
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref_name: ${{ github.ref_name }}

  deploy-gh-pages:
    name: "🌍 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
#    needs: sonarcloud-report
    needs: [check-build, check-repository]
    if: github.ref_name == 'master'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "👤 Git User Configuration"
        run: |
          git config --global user.name 'Rocket Meals'
          git config --global user.email 'nils@baumgartner-software.de'
      - name: "🚀 Deploy to GitHub Pages"
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          CI=false yarn deploy:gh:pages
        working-directory: ./apps/frontend/app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

