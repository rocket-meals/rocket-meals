  sonarqube:
    name: "🔍 SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: [check-repository]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: "🔄 Checkout Repository"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: "🔍 SonarQube Scan"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonarcloud-report:
    name: "📥 Download SonarCloud Report"
    runs-on: ubuntu-latest
    needs: [sonarqube, data-clumps-report, check-repository]
    continue-on-error: true
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "📥 Download SonarCloud reports"
        run: |
          SONAR_PROJECT=$(grep -E '^sonar.projectKey' sonar-project.properties | cut -d= -f2)
          yarn workspace sonarCloudReportDownloader start --token "$SONAR_TOKEN" --project "$SONAR_PROJECT"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: "📝 Generate issue markdown"
        run: |
          yarn workspace sonarCloudReportDownloader generate-issue
      - name: "🐛 Create GitHub issue (close old ones first)"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issuePath = 'reports/sonarCloud/issue.md';
            if (!fs.existsSync(issuePath)) {
              console.log('No issue markdown generated, skipping issue creation');
              return;
            }
            const body = fs.readFileSync(issuePath, 'utf-8');
            const title = '📊 SonarCloud Issues Report';
            const labels = ['sonarcloud'];

            // Close all existing open issues with the sonarcloud label
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed old issue #${issue.number}: ${issue.title}`);
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labels,
            });
            console.log(`Created issue #${created.number}`);
      - name: "💾 Stage reports"
        uses: ./.github/actions/stage-changes
        with:
          name: sonarcloud-reports
          paths: reports/sonarCloud
          description: "update sonarcloud reports"

  data-clumps-report:
    name: "🩺 Analyse Data Clumps"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🗑️ Close old data clumps issues"
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const oldIssues = issues.filter(i => i.title.startsWith('chore: Refactor data clumps'));
            for (const issue of oldIssues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed old issue #${issue.number}: ${issue.title}`);
            }
      - name: "🩺 Analyse data clumps"
        id: data-clumps
        uses: NilsBaumgartner1994/data-clumps-doctor/.github/actions/analyse-data-clumps@master
        with:
          path-to-source: .
          output-path: reports/data-clumps-doctor/data-clumps.json
          badge-output-path: reports/data-clumps-doctor/badges/data-clumps.svg
          source-language-type: typescript
          generate-issue: 'true'
          only-update-if-changes: 'false'
          refactor-amount: 15
          detector-options-paths-ignored-in-detection-comparison: '**/databaseTypes/types.ts'
      - name: "💾 Stage reports"
        uses: ./.github/actions/stage-changes
        with:
          name: data-clumps
          paths: |
            reports/data-clumps-doctor/data-clumps.json
            reports/data-clumps-doctor/badges/data-clumps.svg
          description: "update data-clumps reports"

  backend-directus:
    name: "🔨 Directus Backend Build"
    runs-on: ubuntu-latest
#    needs: sonarcloud-report
    needs: [check-repository]
    steps:
      - name: "🏗 Setup repo"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: "🚀 Build backend"
        if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
        uses: ./.github/actions/backend-build
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  expo-update:
    name: "🏗 EAS Update Production"
    runs-on: ubuntu-latest
    #    needs: sonarcloud-report
    needs: [check-repository]
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🚀 Publish update"
        run: eas update --auto --platform all --non-interactive --channel production
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-android:
    name: "📦 Build & 🚀 Submit Android App"
    runs-on: ubuntu-latest
#    needs: [sonarcloud-report, check-build]
    needs: [check-build-android, check-repository]
    if: needs.check-build-android.outputs.should-build == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🛠️ Build and Submit Android App"
        run: eas build --platform android --non-interactive --profile production --auto-submit
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Only master@rocket-meals/rocket-meals builds the preview APK and gets the
  # README link - forks and other branches must not push commits upstream nor
  # advertise a preview APK from an unverified fork build.
  build-android-preview:
    name: "🧪 Build Android Preview APK"
    runs-on: ubuntu-latest
#    needs: [sonarcloud-report, check-build]
    needs: [check-build-android, check-repository]
    if: needs.check-build-android.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Android Preview APK & update README"
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/frontend/app
          app-key: frontend
          app-label: "Rocket Meals (Frontend)"
          update-readme: 'true'

      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-android-preview-frontend
          paths: README.md
          description: "update Rocket Meals Android preview APK link in README"

  build-ios:
    name: "📦 Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
#    needs: [sonarcloud-report, check-build]
    needs: [check-build-ios, check-repository]
    if: needs.check-build-ios.outputs.should-build == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      - name: "🛠️ Build and Submit iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  geonexia-check-build:
    name: "🔍 Geonexia Check iOS Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare Geonexia iOS Build Number against EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/geonexia/frontend
          platform: ios

  geonexia-build-ios:
    name: "📦 Geonexia Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
    needs: [geonexia-check-build, check-repository]
    if: needs.geonexia-check-build.outputs.should-build == 'true' && needs.check-repository.outputs.is-upstream == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      - name: "🛠️ Build and Submit Geonexia iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/geonexia/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  geonexia-expo-update:
    name: "🌍 Geonexia EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🚀 Publish Geonexia OTA update"
        uses: ./.github/actions/geonexia-expo-update
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref_name: ${{ github.ref_name }}

  # Only master@rocket-meals/rocket-meals builds the Geonexia preview APK and
  # gets the README link - forks and other branches must not push commits
  # upstream nor advertise a preview APK from an unverified fork build.
  geonexia-build-android-preview:
    name: "🧪 Geonexia Build Android Preview APK"
    runs-on: ubuntu-latest
    needs: [geonexia-check-build, check-repository]
    if: needs.geonexia-check-build.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Geonexia Android Preview APK & update README"
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/geonexia/frontend
          eas-profile: preview
          app-key: geonexia
          app-label: "Geonexia"
          update-readme: 'true'

      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-android-preview-geonexia
          paths: README.md
          description: "update Geonexia Android preview APK link in README"

  score-tracker-check-build:
    name: "🔍 Score Tracker Check iOS Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare Score Tracker iOS Build Number against EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/score-tracker/frontend
          platform: ios

  score-tracker-build-ios:
    name: "📦 Score Tracker Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
    needs: [score-tracker-check-build, check-repository]
    if: needs.score-tracker-check-build.outputs.should-build == 'true' && needs.check-repository.outputs.is-upstream == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      - name: "🛠️ Build and Submit Score Tracker iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/score-tracker/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  score-tracker-expo-update:
    name: "🎯 Score Tracker EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🚀 Publish Score Tracker OTA update"
        uses: ./.github/actions/score-tracker-expo-update
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref_name: ${{ github.ref_name }}

  # Only master@rocket-meals/rocket-meals builds the Score Tracker preview APK
  # and gets the README link - forks and other branches must not push commits
  # upstream nor advertise a preview APK from an unverified fork build.
  score-tracker-build-android-preview:
    name: "🧪 Score Tracker Build Android Preview APK"
    runs-on: ubuntu-latest
    needs: [score-tracker-check-build, check-repository]
    if: needs.score-tracker-check-build.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Score Tracker Android Preview APK & update README"
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/score-tracker/frontend
          eas-profile: preview
          app-key: score-tracker
          app-label: "Score Tracker"
          update-readme: 'true'

      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-android-preview-score-tracker
          paths: README.md
          description: "update Score Tracker Android preview APK link in README"

  tag-und-jahr-check-build:
    name: "🔍 Tag und Jahr Check iOS Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare Tag und Jahr iOS Build Number against EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/tag-und-jahr/frontend
          platform: ios

  tag-und-jahr-build-ios:
    name: "📦 Tag und Jahr Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
    needs: [tag-und-jahr-check-build, check-repository]
    if: needs.tag-und-jahr-check-build.outputs.should-build == 'true' && needs.check-repository.outputs.is-upstream == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      # eas build --non-interactive cannot bootstrap credentials for a new app
      # ("Credentials are not set up. Run this command again in interactive
      # mode.") - this creates/validates them headless first, using the ASC API
      # key exported by setup-and-install (prepare-asc-api-key).
      - name: "🔐 Ensure Tag und Jahr iOS build credentials"
        uses: ./.github/actions/eas-ios-build-credentials
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/tag-und-jahr/frontend
          # The App Group must exist and be assigned to both bundle ids (one-time
          # manual portal step, see apps/tag-und-jahr/README.md) - verified here
          # so a missing assignment fails fast instead of deep in the Xcode build.
          verify-app-group: group.de.baumgartner-software.day-and-year
          verify-bundle-ids: de.baumgartner-software.day-and-year,de.baumgartner-software.day-and-year.ExpoWidgetsTarget
      # --auto-submit cannot link an App Store Connect API key to a new app in
      # non-interactive mode ("App Store Connect API Keys cannot be set up in
      # --non-interactive mode"). The submit profile therefore references the
      # key locally (ascApiKeyPath/-Id/-IssuerId in eas.json); this step places
      # the .p8 written by prepare-asc-api-key at that path. The file is
      # gitignored (*.p8).
      - name: "🔑 Provide ASC API key for auto-submit"
        run: cp "$EXPO_ASC_API_KEY_PATH" ./apps/tag-und-jahr/frontend/asc-api-key.p8
      - name: "🛠️ Build and Submit Tag und Jahr iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/tag-und-jahr/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  tag-und-jahr-expo-update:
    name: "🕰️ Tag und Jahr EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🚀 Publish Tag und Jahr OTA update"
        uses: ./.github/actions/tag-und-jahr-expo-update
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref_name: ${{ github.ref_name }}

  # Only master@rocket-meals/rocket-meals builds the Tag und Jahr preview APK
  # and gets the README link - forks and other branches must not push commits
  # upstream nor advertise a preview APK from an unverified fork build.
  tag-und-jahr-build-android-preview:
    name: "🧪 Tag und Jahr Build Android Preview APK"
    runs-on: ubuntu-latest
    needs: [tag-und-jahr-check-build, check-repository]
    if: needs.tag-und-jahr-check-build.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Tag und Jahr Android Preview APK & update README"
        uses: ./.github/actions/build-android-preview-apk
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/tag-und-jahr/frontend
          eas-profile: preview
          app-key: tag-und-jahr
          app-label: "Tag und Jahr"
          update-readme: 'true'

      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-android-preview-tag-und-jahr
          paths: README.md
          description: "update Tag und Jahr Android preview APK link in README"

  playground-check-build:
    name: "🔍 Playground Check iOS Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare Playground iOS Build Number against EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/playground/frontend
          platform: ios

  # The playground is a development-only app: this job stays red until it has
  # been created once in App Store Connect and its Apple-ID is stored in
  # apps/playground/frontend/config.ts (appleAppId) - see apps/playground/README.md.
  # The LibGodot prebuilts are fetched on the EAS worker by the
  # eas-build-post-install hook in apps/playground/frontend/package.json.
  playground-build-ios:
    name: "📦 Playground Build & 🚀 Submit iOS App"
    runs-on: ubuntu-latest
    needs: [playground-check-build, check-repository]
    if: needs.playground-check-build.outputs.should-build == 'true' && needs.check-repository.outputs.is-upstream == 'true'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      # eas build --non-interactive cannot bootstrap credentials for a new app
      # ("Credentials are not set up. Run this command again in interactive
      # mode.") - this creates/validates them headless first, using the ASC API
      # key exported by setup-and-install (prepare-asc-api-key).
      - name: "🔐 Ensure Playground iOS build credentials"
        uses: ./.github/actions/eas-ios-build-credentials
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/playground/frontend
      # --auto-submit cannot link an App Store Connect API key to a new app in
      # non-interactive mode ("App Store Connect API Keys cannot be set up in
      # --non-interactive mode"). The submit profile therefore references the
      # key locally (ascApiKeyPath/-Id/-IssuerId in eas.json); this step places
      # the .p8 written by prepare-asc-api-key at that path. The file is
      # gitignored (*.p8).
      - name: "🔑 Provide ASC API key for auto-submit"
        run: cp "$EXPO_ASC_API_KEY_PATH" ./apps/playground/frontend/asc-api-key.p8
      - name: "🛠️ Build and Submit Playground iOS App"
        run: eas build --platform ios --non-interactive --auto-submit
        working-directory: ./apps/playground/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  playground-expo-update:
    name: "🕹️ Playground EAS Update (OTA)"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🚀 Publish Playground OTA update"
        uses: ./.github/actions/playground-expo-update
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref_name: ${{ github.ref_name }}

  # Apple's public App Store Connect API cannot CREATE an app ("Don't use this
  # API to create new apps") - that one step needs an Apple-ID login, see
  # `yarn appstore:create-app` and the repository README. Everything after it is
  # automated here: with the API key alone this job reads the Apple-ID of the
  # app as soon as it exists and commits it into config.ts/eas.json, so the iOS
  # build/submit job stops needing a manual copy&paste. While the app does not
  # exist yet the job succeeds and says so.
  playground-appstore-app-id:
    name: "🍎 Playground App Store Connect Apple-ID"
    runs-on: ubuntu-latest
    needs: [check-repository]
    if: ${{ needs.check-repository.outputs.is-upstream == 'true' }}
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
      - name: "🍎 Fill in the App Store Connect Apple-ID"
        uses: ./.github/actions/appstore-app-id
        with:
          working-directory: ./apps/playground/frontend
          app-key: playground

  deploy-gh-pages:
    name: "🌍 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
#    needs: sonarcloud-report
    needs: [check-repository]
    if: github.ref_name == 'master'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "👤 Git User Configuration"
        run: |
          git config --global user.name 'Rocket Meals'
          git config --global user.email 'nils@baumgartner-software.de'
      - name: "🚀 Deploy to GitHub Pages"
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          CI=false yarn deploy:gh:pages
        working-directory: ./apps/frontend/app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single writer to the branch. Every job above only uploads its changes as a
  # patch artifact; this job applies all of them and creates exactly one commit.
  # `if: always()` so that a failing build (e.g. one iOS preview) does not throw
  # away the results of all the jobs that did succeed.
  publish-staged-changes:
    name: "📤 Publish Staged Changes"
    runs-on: ubuntu-latest
    needs:
      - check-repository
      - sonarcloud-report
      - data-clumps-report
      - backend-directus
      - geonexia-expo-update
      - score-tracker-expo-update
      - tag-und-jahr-expo-update
      - playground-expo-update
      - playground-appstore-app-id
      - build-android-preview
      - geonexia-build-android-preview
      - score-tracker-build-android-preview
      - tag-und-jahr-build-android-preview
      - build-ios-preview
      - geonexia-build-ios-preview
      - score-tracker-build-ios-preview
      - tag-und-jahr-build-ios-preview
    if: always() && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      # fetch-depth: 0 is required - `git apply --3way` needs the blobs the
      # staged patches were built against.
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "📤 Apply and push all staged changes"
        uses: ./.github/actions/publish-staged-changes
        with:
          branch: ${{ github.ref_name }}
          commit-message: "chore: update generated files [skip ci]"

  # iOS previews (ad-hoc) mirror the Android preview APK jobs: only
  # master@rocket-meals/rocket-meals builds them and publishes the install
  # link (EAS build details page) into the README. Devices must be
  # registered via `eas device:create` to install these builds.
  build-ios-preview:
    name: "🧪 Build iOS Preview (Ad-hoc)"
    runs-on: ubuntu-latest
    needs: [check-build-ios, check-repository]
    if: needs.check-build-ios.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build iOS Preview & update README"
        uses: ./.github/actions/build-ios-preview
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/frontend/app
          app-key: frontend
          app-label: "Rocket Meals (Frontend)"
          update-readme: 'true'
      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-ios-preview-frontend
          paths: README.md
          description: "update Rocket Meals iOS preview link in README"

  geonexia-build-ios-preview:
    name: "🧪 Geonexia Build iOS Preview (Ad-hoc)"
    runs-on: ubuntu-latest
    needs: [geonexia-check-build, check-repository]
    if: needs.geonexia-check-build.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Geonexia iOS Preview & update README"
        uses: ./.github/actions/build-ios-preview
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/geonexia/frontend
          app-key: geonexia
          app-label: "Geonexia"
          update-readme: 'true'
      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-ios-preview-geonexia
          paths: README.md
          description: "update Geonexia iOS preview link in README"

  score-tracker-build-ios-preview:
    name: "🧪 Score Tracker Build iOS Preview (Ad-hoc)"
    runs-on: ubuntu-latest
    needs: [score-tracker-check-build, check-repository]
    if: needs.score-tracker-check-build.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Score Tracker iOS Preview & update README"
        uses: ./.github/actions/build-ios-preview
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/score-tracker/frontend
          app-key: score-tracker
          app-label: "Score Tracker"
          update-readme: 'true'
      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-ios-preview-score-tracker
          paths: README.md
          description: "update Score Tracker iOS preview link in README"

  tag-und-jahr-build-ios-preview:
    name: "🧪 Tag und Jahr Build iOS Preview (Ad-hoc)"
    runs-on: ubuntu-latest
    needs: [tag-und-jahr-check-build, check-repository]
    if: needs.tag-und-jahr-check-build.outputs.should-build == 'true' && github.ref_name == 'master' && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🧪 Build Tag und Jahr iOS Preview & update README"
        uses: ./.github/actions/build-ios-preview
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/tag-und-jahr/frontend
          app-key: tag-und-jahr
          app-label: "Tag und Jahr"
          update-readme: 'true'
      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-ios-preview-tag-und-jahr
          paths: README.md
          description: "update Tag und Jahr iOS preview link in README"
