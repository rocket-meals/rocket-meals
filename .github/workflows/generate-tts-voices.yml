name: "🗣️ Generate TTS Voices"

on:
  workflow_dispatch:
  push:
    branches: [main, master, dev]
    paths:
      - "apps/geonexia/frontend/assets/tts-generated-voices/voices.json"
      - "scripts/generate-tts-voices.py"

concurrency:
  group: generate-tts-voices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-voices:
    name: "🗣️ Generate TTS MP3 files"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Install mistralai"
        run: pip install mistralai

      - name: "🗣️ Generate voice MP3 files"
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/generate-tts-voices.py

      - name: "💾 Commit generated voices"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f apps/geonexia/frontend/assets/tts-generated-voices/*.mp3
          git add -f apps/geonexia/frontend/assets/tts-generated-voices/generatedVoicesIndex.ts
          if git diff --cached --quiet; then
            echo "No changes to commit – voices are up to date."
          else
            git commit -m "chore: regenerate TTS voice assets [skip ci]"
            git push
          fi
