name: 🧪 Android Preview Build

on:
  workflow_run:
    workflows: ["🔧 Auto-Linter"]
    branches: [master]
    types:
      - completed

jobs:
  build-preview-apk:
    name: 🧪 Build Android Preview APK
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: 🧰 Setup Expo Environment
        uses: ./.github/actions/setup-expo-environment
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔢 Increment Build Number
        id: increment
        uses: ./.github/actions/increment-build-number
        with:
          working-directory: apps/frontend/app
          commit-message: '🔢 Increment Android preview build number [skip ci]'

      - name: 🧪 Build with previewApk profile
        run: eas build --platform android --non-interactive --profile previewApk
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
