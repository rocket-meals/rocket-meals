name: "🍎 iOS Submit for Review: Rocket Meals"

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Changelog-Text (What's New), der in App Store Connect gesetzt wird"
        required: false
        default: "Fehlerbehebungen und Aktualisierung von Bibliotheken."

  # After a successful CI run a new iOS build may have been uploaded. Apple needs a
  # while to process it, so the submit script waits for processing builds
  # (IOS_SUBMIT_MAX_WAIT_MINUTES) and submits once the build turns VALID.
  workflow_run:
    workflows: ["🚀 CI"]
    types: [completed]
    branches: [master]

# Only the newest run per app survives: when several builds are created back to
# back, a newer run cancels an older one that is still waiting for Apple to
# process its (now outdated) build - the newest run submits the newest build.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  submit-for-review:
    name: "🚀 Submit latest build for App Review"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Post-CI trigger only reacts to successful CI runs; manual runs always go.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Always the upstream master branch, never the head of the run that
      # triggered this workflow: a workflow_run event may originate from a fork,
      # and this job holds the App Store Connect secrets. The checkout token is
      # not persisted either - nothing here pushes back to the repository.
      - name: "🔄 Checkout Repository"
        # NOSONAR - "Make sure that no untrusted code is executed from a fork": already
        # mitigated and therefore suppressed instead of "fixed". The checkout is pinned to
        # `ref: master` of the upstream repository, so the head of the triggering (possibly
        # forked) workflow_run is never checked out, and `persist-credentials: false` keeps
        # the checkout token out of the workspace. See "Umgang mit SonarCloud-Findings" in
        # the README.
        uses: actions/checkout@v4 # NOSONAR
        with:
          ref: master
          persist-credentials: false

      # While getMajorVersion() in the app's config.ts is below 1 the app is still in
      # development - automated runs must not submit it to App Review. A manual
      # workflow_dispatch bypasses this gate deliberately.
      - name: "🔢 Check release readiness (major version)"
        id: release-check
        env:
          CONFIG_PATH: apps/frontend/app/config.ts
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          MAJOR=$(node -e '
            const fs = require("fs");
            const content = fs.readFileSync(process.env.CONFIG_PATH, "utf-8");
            const match = content.match(/function\s+getMajorVersion\s*\(\)[^{]*\{[\s\S]*?return\s+(\d+)/);
            if (!match) { console.error("getMajorVersion() not found in " + process.env.CONFIG_PATH); process.exit(1); }
            console.log(match[1]);
          ')
          echo "Major version: $MAJOR"
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$MAJOR" -lt 1 ]; then
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Major version $MAJOR is below 1 - app is still in development, automated submit is skipped."
          else
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi

      # Forks (tenant repositories) may not have the App Store Connect key configured -
      # in that case automated runs should skip quietly instead of failing every day.
      - name: "🔐 Check App Store Connect credentials"
        id: guard
        env:
          ASC_KEY: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}
        run: |
          if [ -n "$ASC_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Secret EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT ist nicht gesetzt - Submit wird übersprungen."
          fi

      - name: "⚙️ Setup Node.js"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: "⚙️ Enable Corepack for Yarn v2"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true'
        run: corepack enable

      - name: "📦 Install dependencies"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true'
        # --mode=skip-build disables dependency lifecycle scripts (supply-chain hardening);
        # the submit script only needs ts-node/typescript, which require no build step.
        run: yarn install --immutable --mode=skip-build

      - name: "🔐 Prepare Apple App Store Connect API key"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true'
        uses: ./.github/actions/prepare-asc-api-key
        with:
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}

      - name: "🏷️ Resolve customer from repository name"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true'
        run: bash scripts/customer-config.sh >> "$GITHUB_ENV"

      - name: "📱 Resolve iOS bundle identifier and submit flag"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true'
        working-directory: ./apps/frontend/app
        run: |
          set -euo pipefail

          node - <<'EOF' >> "$GITHUB_ENV"
          require('ts-node').register({
            transpileOnly: true,
            compilerOptions: { module: 'Node16', moduleResolution: 'node16' },
          });
          const { getCustomerConfig } = require('./config.ts');
          const config = getCustomerConfig();
          console.log(`IOS_BUNDLE_ID=${config.bundleIdIos}`);
          // Apps like the Rocket Meals demo/test app set iosAppStoreReviewSubmitEnabled
          // to false so their builds are never submitted to App Review.
          console.log(`IOS_REVIEW_SUBMIT_ENABLED=${config.iosAppStoreReviewSubmitEnabled !== false}`);
          EOF

      - name: "⏭️ Review submit is disabled for this app"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true' && env.IOS_REVIEW_SUBMIT_ENABLED != 'true'
        run: echo "⏭️ iosAppStoreReviewSubmitEnabled ist für diesen Tenant (${IOS_BUNDLE_ID}) deaktiviert (config.ts) - es wird nichts zur Review eingereicht."

      - name: "🚀 Submit latest build for App Review"
        if: steps.guard.outputs.available == 'true' && steps.release-check.outputs.submit == 'true' && env.IOS_REVIEW_SUBMIT_ENABLED == 'true'
        run: yarn workspace rocket-meals-scripts submit:ios:review
        env:
          IOS_RELEASE_NOTES: ${{ inputs.release_notes || 'Fehlerbehebungen und Aktualisierung von Bibliotheken.' }}
          # Ground truth for the pre-submit metadata sync (Altersfreigabe & Co),
          # see docs/STORE_METADATA.md.
          STORE_METADATA_MODULE: apps/frontend/app/store-metadata.ts
          # Store screenshots committed under store-screenshots/<tenant>/ are uploaded
          # to the version before it is submitted, see docs/STORE_SCREENSHOTS.md.
          STORE_SCREENSHOTS_MODULE: apps/frontend/app/store-screenshots.ts
          # Post-CI runs skip gracefully when there is nothing to submit
          # and never re-submit versions Apple has rejected.
          IOS_SUBMIT_AUTO: ${{ github.event_name != 'workflow_dispatch' }}
          # Only the post-CI trigger waits for Apple to finish processing a fresh build
          # (up to 120 minutes from build upload until it is submittable).
          IOS_SUBMIT_MAX_WAIT_MINUTES: ${{ github.event_name == 'workflow_run' && '120' || '0' }}
