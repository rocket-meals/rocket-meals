name: "🍎 iOS Submit for Review: Rocket Meals"

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Changelog-Text (What's New), der in App Store Connect gesetzt wird"
        required: false
        default: "Fehlerbehebungen und Aktualisierung von Bibliotheken."
  schedule:
    # Täglich prüfen, ob ein fertig verarbeiteter Build eingereicht werden kann -
    # z.B. sobald eine vorherige Review abgeschlossen ist. Gibt es nichts zu tun,
    # wird der Lauf sauber übersprungen (grün). Zeit in UTC.
    - cron: "13 6 * * *"
  workflow_run:
    # Nach jedem erfolgreichen Build-Lauf automatisch einreichen. Das Skript wartet
    # dabei darauf, dass Apple den frisch hochgeladenen Build fertig verarbeitet hat.
    workflows: ["🚀 CI", "🚀 Build and Update Rocket Meals"]
    types: [completed]
    branches: [master]

# Nie zwei Einreichungen gleichzeitig (z.B. Cron + Build-Trigger) laufen lassen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  submit-for-review:
    name: "🚀 Submit latest build for App Review"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: master

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: "⚙️ Enable Corepack for Yarn v2"
        run: corepack enable

      - name: "📦 Install dependencies"
        # --mode=skip-build disables dependency lifecycle scripts (supply-chain hardening);
        # the submit script only needs ts-node/typescript, which require no build step.
        run: yarn install --immutable --mode=skip-build

      - name: "🔐 Prepare Apple App Store Connect API key"
        uses: ./.github/actions/prepare-asc-api-key
        with:
          EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT: ${{ secrets.EXPO_APPLE_APPSTORECONNECT_API_KEY_CONTENT }}

      - name: "🏷️ Resolve customer from repository name"
        run: bash scripts/customer-config.sh >> "$GITHUB_ENV"

      - name: "📱 Resolve iOS bundle identifier"
        working-directory: ./apps/frontend/app
        run: |
          set -euo pipefail

          BUNDLE_ID=$(node - <<'EOF'
          require('ts-node').register({
            transpileOnly: true,
            compilerOptions: { module: 'Node16', moduleResolution: 'node16' },
          });
          const { getCustomerConfig } = require('./config.ts');
          console.log(getCustomerConfig().bundleIdIos);
          EOF
          )
          echo "IOS_BUNDLE_ID=${BUNDLE_ID}" >> "$GITHUB_ENV"

      - name: "🚀 Submit latest build for App Review"
        run: yarn workspace rocket-meals-scripts submit:ios:review
        env:
          IOS_RELEASE_NOTES: ${{ inputs.release_notes || 'Fehlerbehebungen und Aktualisierung von Bibliotheken.' }}
          # Automatisierte Läufe (Cron/Build-Trigger) überspringen sauber, wenn es
          # nichts einzureichen gibt; nur manuelle Läufe melden das als Fehler.
          IOS_SUBMIT_AUTOMATED: ${{ github.event_name != 'workflow_dispatch' }}
          # Direkt nach einem Build braucht Apple i.d.R. einige Minuten bis der
          # hochgeladene Build verarbeitet (VALID) ist - so lange warten wir maximal.
          IOS_SUBMIT_WAIT_FOR_PROCESSING_MINUTES: ${{ github.event_name == 'workflow_run' && '90' || '0' }}
