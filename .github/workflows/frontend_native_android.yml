name: 🤖 Build & Submit Android

on:
  workflow_run:
    workflows: ["🔧 Auto-Linter"]
    branches: [master]
    types:
      - completed
  push:
    branches: [master]
    paths:
      - 'apps/frontend/app/config.ts'

jobs:
  check-build:
    name: 🔍 Check Build Number
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'apps/frontend/app/config.ts'))
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: 🔍 Compare Build Number
        id: check
        uses: ./.github/actions/check-build-number

  build-android:
    name: 📦 Build & 🚀 Submit Android App
    needs: check-build
    if: needs.check-build.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v3

      - name: 🧰 Setup Node.js, Yarn & Dependencies
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🛠️ Build Android App
        run: eas build --platform android --non-interactive --profile production
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Submit Android Build to Play Store
        run: eas submit --platform android --non-interactive --latest --profile production
        working-directory: ./apps/frontend/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
