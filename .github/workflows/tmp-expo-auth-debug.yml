name: "🔎 TMP Expo auth debug"

# Temporary diagnostic for the Expo Go 403 ("project requires authentication"):
# rocket-meals-dev has server-side privacy "hidden". This compares the privacy
# value of all EAS projects of the org to see whether newer projects get a
# non-hidden default. Remove after use.
on:
  workflow_dispatch:
  push:
    branches: ["claude/expo-go-sdk57-project-missing-lf7o3x"]
    paths: [".github/workflows/tmp-expo-auth-debug.yml"]

jobs:
  expo-auth-debug:
    name: "🔎 Expo auth debug"
    runs-on: ubuntu-latest
    steps:
      - name: "GraphQL: privacy of all org projects"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for FULLNAME in \
            "@baumgartner-software/rocket-meals-dev" \
            "@baumgartner-software/rocket-meals-swosy" \
            "@baumgartner-software/rocket-meals-studi-futter" \
            "@baumgartner-software/geonexia" \
            "@baumgartner-software/score-tracker" \
            "@baumgartner-software/tag-und-jahr" \
            "@jack5496/expo-go"; do
            RESULT=$(curl -s https://api.expo.dev/graphql \
              -H 'content-type: application/json' \
              -H "authorization: Bearer $EXPO_TOKEN" \
              -d "{\"query\":\"query{app{byFullName(fullName:\\\"$FULLNAME\\\"){id privacy}}}\"}")
            echo "$FULLNAME -> $RESULT"
          done
