name: "🔎 TMP Expo auth debug"

# Temporary, user-approved: sets the server-side privacy of all EAS projects
# of the org from "hidden" (invisible and unopenable in Expo Go, even for
# signed-in members) to "public" using the legacy MeMutation.updateApp.
# Remove after use.
on:
  workflow_dispatch:
  push:
    branches: ["claude/expo-go-sdk57-project-missing-lf7o3x"]
    paths: [".github/workflows/tmp-expo-auth-debug.yml"]

jobs:
  expo-auth-debug:
    name: "🔎 Expo auth debug"
    runs-on: ubuntu-latest
    steps:
      - name: "Set privacy of all org projects to public"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for APP_ID in \
            "36f72583-5997-4602-8609-05f39444f2e7" \
            "4147159f-d7b5-4db5-b6eb-f9988519950c" \
            "461671f9-774f-4bc4-80a8-5601313539b0" \
            "8fbc9283-a03b-4ca0-92cd-fcb87d2e64f4" \
            "7ea1e999-21dd-41ec-96b3-fc8aa7ad9993" \
            "354220f2-0d5a-46a0-bf47-15d8433432a9"; do
            RESULT=$(curl -s https://api.expo.dev/graphql \
              -H 'content-type: application/json' \
              -H "authorization: Bearer $EXPO_TOKEN" \
              -d "{\"query\":\"mutation{me{updateApp(appData:{id:\\\"$APP_ID\\\",privacy:\\\"public\\\"}){id privacy}}}\"}")
            echo "$APP_ID -> $RESULT"
          done

      - name: "Verify privacy of all org projects"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for FULLNAME in \
            "@baumgartner-software/rocket-meals-dev" \
            "@baumgartner-software/rocket-meals-swosy" \
            "@baumgartner-software/rocket-meals-studi-futter" \
            "@baumgartner-software/geonexia" \
            "@baumgartner-software/score-tracker" \
            "@baumgartner-software/tag-und-jahr"; do
            RESULT=$(curl -s https://api.expo.dev/graphql \
              -H 'content-type: application/json' \
              -H "authorization: Bearer $EXPO_TOKEN" \
              -d "{\"query\":\"query{app{byFullName(fullName:\\\"$FULLNAME\\\"){id privacy}}}\"}")
            echo "$FULLNAME -> $RESULT"
          done
