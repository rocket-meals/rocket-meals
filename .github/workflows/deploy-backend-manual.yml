name: "🚀 Deploy Backend (Manual)"

# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for the server list lives in the "setup" job below.
# Adding a new server only requires two changes:
#   1. Add it to the `options` list here (for the UI dropdown).
#   2. Add it to the ALL_SERVERS list in the setup job.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      server_preset:
        description: 'Backend server (preset)'
        required: true
        type: choice
        default: 'test.rocket-meals.de'
        options:
          - Alle
          - test.rocket-meals.de
          - swosy.rocket-meals.de
          - studi-futter.rocket-meals.de
          - custom
      server_host:
        description: 'Custom backend host (only used when preset = custom)'
        required: false
        type: string
        default: ''

jobs:
  setup:
    name: "🔍 Resolve target servers"
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.resolve.outputs.servers }}
    steps:
      - name: "📋 Build server matrix"
        id: resolve
        run: |
          ALL_SERVERS='["test.rocket-meals.de","swosy.rocket-meals.de","studi-futter.rocket-meals.de"]'
          PRESET="${{ github.event.inputs.server_preset }}"
          CUSTOM="${{ github.event.inputs.server_host }}"

          if [ "$PRESET" = "Alle" ]; then
            SERVERS="$ALL_SERVERS"
          elif [ "$PRESET" = "custom" ]; then
            SERVERS="[\"$CUSTOM\"]"
          else
            SERVERS="[\"$PRESET\"]"
          fi

          echo "servers=$SERVERS" >> $GITHUB_OUTPUT
          echo "ℹ️ Target servers: $SERVERS"

  deploy:
    name: "🚀 Deploy to ${{ matrix.server }}"
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.setup.outputs.servers) }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🚀 Deploy to ${{ matrix.server }}"
        uses: ./.github/actions/deploy-server
        with:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SERVER_HOST: ${{ matrix.server }}
