name: "🚀 Deploy Backend (Manual)"

on:
  workflow_dispatch:
    inputs:
      server_preset:
        description: 'Backend server (preset); "all" deploys to every preset server'
        required: true
        type: choice
        default: 'test.rocket-meals.de'
        options:
          - test.rocket-meals.de
          - swosy.rocket-meals.de
          - studi-futter.rocket-meals.de
          - all
          - custom
      server_host:
        description: 'Custom backend host (overrides preset when set)'
        required: false
        type: string
        default: ''

jobs:
  resolve-hosts:
    name: "🔍 Resolve target hosts"
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.resolve-hosts.outputs.hosts }}
    steps:
      - name: "🔍 Resolve target hosts"
        id: resolve-hosts
        env:
          CUSTOM: ${{ github.event.inputs.server_host }}
          PRESET: ${{ github.event.inputs.server_preset }}
          # Keep in sync with the preset options above
          ALL_HOSTS: '["test.rocket-meals.de","swosy.rocket-meals.de","studi-futter.rocket-meals.de"]'
        run: |
          if [ -n "$CUSTOM" ]; then
            HOSTS=$(jq -cn --arg host "$CUSTOM" '[$host]')
            echo "ℹ️ Using custom host: $CUSTOM"
          elif [ "$PRESET" = "all" ]; then
            HOSTS="$ALL_HOSTS"
            echo "ℹ️ Using all preset hosts: $ALL_HOSTS"
          elif [ "$PRESET" = "custom" ]; then
            echo "❌ Preset 'custom' requires a custom backend host"
            exit 1
          else
            HOSTS=$(jq -cn --arg host "$PRESET" '[$host]')
            echo "ℹ️ Using preset host: $PRESET"
          fi
          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"

  deploy:
    name: "🚀 Deploy ${{ matrix.host }}"
    needs: resolve-hosts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.resolve-hosts.outputs.hosts) }}
    # Shared with backend-daily-restart.yml: never run two deploys on the same
    # server at once.
    concurrency:
      group: deploy-backend-${{ matrix.host }}
      cancel-in-progress: false
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🚀 Deploy to ${{ matrix.host }}"
        uses: ./.github/actions/deploy-server
        with:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SERVER_HOST: ${{ matrix.host }}
          FORK_SYNC_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
