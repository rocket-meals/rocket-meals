name: "🚀 Deploy Backend (Manual)"

# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for the server list: ALL_SERVERS in the "setup" job.
# Adding a new server only requires ONE change: add it to ALL_SERVERS below.
# To deploy to a single server, pick "custom" and enter the hostname.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      server_preset:
        description: 'Backend server – "Alle" deploys all servers; "custom" uses the host below'
        required: true
        type: choice
        default: 'Alle'
        options:
          - Alle
          - custom
      server_host:
        description: 'Custom backend host (only used when preset = custom, e.g. test.rocket-meals.de)'
        required: false
        type: string
        default: ''

jobs:
  setup:
    name: "🔍 Resolve target servers"
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.resolve.outputs.servers }}
    steps:
      - name: "📋 Build server matrix"
        id: resolve
        run: |
          ALL_SERVERS='["test.rocket-meals.de","swosy.rocket-meals.de","studi-futter.rocket-meals.de"]'
          PRESET="${{ github.event.inputs.server_preset }}"
          CUSTOM="${{ github.event.inputs.server_host }}"

          if [ "$PRESET" = "custom" ]; then
            SERVERS="[\"$CUSTOM\"]"
          else
            SERVERS="$ALL_SERVERS"
          fi

          echo "servers=$SERVERS" >> $GITHUB_OUTPUT
          echo "ℹ️ Target servers: $SERVERS"

  deploy:
    name: "🚀 Deploy to ${{ matrix.server }}"
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.setup.outputs.servers) }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🚀 Deploy to ${{ matrix.server }}"
        uses: ./.github/actions/deploy-server
        with:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SERVER_HOST: ${{ matrix.server }}
