name: "🧑‍💻 Playground Dev Client"

# Builds an expo-dev-client development build for Playground whenever a new
# native build is due: the local build number (getBuildNumber() in config.ts)
# is compared against the latest finished EAS build of the "development"
# profile. This fires on master pushes (a new release build implies a bumped
# build number) and on PRs that raise the build number, so a matching dev
# client is ready before/alongside the store build. Expo Go is currently not
# usable for private projects (see expo/expo session bug), so the dev client
# is the supported way to test PR previews on devices. For the Godot experiment
# the dev client is not just convenient but required: react-native-godot is a
# native module and cannot run in Expo Go. Its LibGodot prebuilts are fetched on
# the EAS worker by the eas-build-post-install hook in the app's package.json.

on:
  push:
    branches: [master]
    paths:
      - "apps/playground/**"
      - "packages/**"
      - ".github/workflows/playground-dev-client.yml"
  pull_request:
    paths:
      - "apps/playground/**"
      - "packages/**"
      - ".github/workflows/playground-dev-client.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force the dev client build (skip the online build number check)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-repository:
    name: "🔍 Check Repository"
    runs-on: ubuntu-latest
    outputs:
      is-upstream: ${{ steps.check.outputs.is-upstream }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🔍 Check Repository Type"
        id: check
        uses: ./.github/actions/check-repository

  check-build-number:
    name: "🔍 Check Dev Client Build Number (online)"
    runs-on: ubuntu-latest
    needs: check-repository
    # Forks have no EXPO_TOKEN and must not trigger builds on our EAS account.
    if: >-
      needs.check-repository.outputs.is-upstream == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      local-build-number: ${{ steps.check.outputs.local-build-number }}
      online-build-number: ${{ steps.check.outputs.online-build-number }}
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: "🔍 Compare build number against latest development build on EAS"
        id: check
        uses: ./.github/actions/check-build-number-online
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          working-directory: ./apps/playground/frontend
          platform: ios
          build-profile: development

  build-dev-client:
    name: "📱 Build Playground Dev Client (Android + iOS)"
    runs-on: ubuntu-latest
    needs: [check-repository, check-build-number]
    timeout-minutes: 120
    if: >-
      needs.check-build-number.outputs.should-build == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.force)
    permissions:
      pull-requests: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "🤖 Build Android Dev Client"
        run: eas build --platform android --profile development --non-interactive --json > eas-build-dev-android.json
        working-directory: ./apps/playground/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Runs even if the Android build failed so both platforms report
      # independently. One-time setup per app: ad-hoc credentials must exist
      # on EAS (eas device:create + one interactive ios build).
      - name: "🍏 Build iOS Dev Client"
        if: ${{ !cancelled() }}
        run: eas build --platform ios --profile development --non-interactive --json > eas-build-dev-ios.json
        working-directory: ./apps/playground/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: "📤 Upload raw EAS build JSON"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-dev-client-build-output
          path: apps/playground/frontend/eas-build-dev-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: "💬 Report build results (summary + PR comment)"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'apps/playground/frontend';
            const marker = '<!-- playground-dev-client-comment -->';

            const readBuilds = file => {
              try {
                const parsed = JSON.parse(fs.readFileSync(`${dir}/${file}`, 'utf8'));
                return Array.isArray(parsed) ? parsed : [parsed];
              } catch {
                return [];
              }
            };

            const builds = [...readBuilds('eas-build-dev-android.json'), ...readBuilds('eas-build-dev-ios.json')];

            const lines = [
              marker,
              '## 🧑‍💻 Playground Dev Client',
              '',
            ];

            if (builds.length === 0) {
              lines.push('❌ No dev client build results found - check the workflow logs.');
            } else {
              lines.push('| Platform | Version | Build | Install |');
              lines.push('|---|---|---|---|');
              for (const b of builds) {
                const account = b.project?.ownerAccount?.name ?? 'baumgartner-software';
                const slug = b.project?.slug ?? 'playground';
                const pageUrl = `https://expo.dev/accounts/${account}/projects/${slug}/builds/${b.id}`;
                const artifactUrl = b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl;
                const install = artifactUrl ? `[Download](${artifactUrl})` : `[Build page](${pageUrl})`;
                lines.push(`| ${b.platform} | ${b.appVersion} (${b.appBuildVersion}) | [${b.id.slice(0, 8)}](${pageUrl}) | ${install} |`);
              }
              for (const [platform, label] of [['ANDROID', 'Android'], ['IOS', 'iOS']]) {
                if (!builds.some(b => (b.platform || '').toUpperCase() === platform)) {
                  lines.push('');
                  lines.push(`> ⚠️ No ${label} build result - the EAS build failed or did not start. Check the workflow logs and the linked EAS build logs on expo.dev for the actual error.`);
                }
              }
              lines.push('');
              lines.push('Install the dev client once per build number bump, then load JS changes via `npx expo start --dev-client` or an EAS Update (PR preview) - no rebuild needed.');
            }

            const body = lines.join('\n');
            core.summary.addRaw(body).write();

            if (context.eventName !== 'pull_request') {
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # Only master pushes update the README (same rule as the preview APK links).
  # This is a separate job that runs even when the native build was skipped:
  # the bumped build number may already have been built from the PR, or a
  # previous run was cancelled mid-build (the EAS build finishes server-side
  # regardless). The links come from the latest finished development build on
  # EAS, so the README always converges to the newest dev client.
  update-readme:
    name: "📝 Update dev client links in README"
    runs-on: ubuntu-latest
    needs: [check-repository, check-build-number, build-dev-client]
    if: >-
      always() && github.event_name == 'push'
      && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
    steps:
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
      - name: "🧰 Setup Node.js, Yarn & Dependencies"
        uses: ./.github/actions/setup-and-install
        with:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Fail open with an empty list: renderDevClientBlock() then skips the
      # README update instead of wiping the existing links.
      - name: "📡 Fetch latest finished dev client builds from EAS"
        working-directory: ./apps/playground/frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --build-profile development --status finished --limit 1 --non-interactive --json > eas-build-dev-android.json || echo "[]" > eas-build-dev-android.json
          eas build:list --platform ios --build-profile development --status finished --limit 1 --non-interactive --json > eas-build-dev-ios.json || echo "[]" > eas-build-dev-ios.json
      - name: "📝 Update dev client links in README"
        run: yarn workspace rocket-meals-scripts dev-client:update-readme
        env:
          README_PATH: ${{ github.workspace }}/README.md
          APP_KEY: playground
          APP_LABEL: "Playground"
          ANDROID_BUILD_JSON: ${{ github.workspace }}/apps/playground/frontend/eas-build-dev-android.json
          IOS_BUILD_JSON: ${{ github.workspace }}/apps/playground/frontend/eas-build-dev-ios.json
          # eas build:list --json omits the project info, so the iOS build page
          # URL needs these as fallback (same values as the PR comment step).
          EAS_ACCOUNT_NAME: baumgartner-software
          EAS_PROJECT_SLUG: playground
      - name: "💾 Stage README update"
        uses: ./.github/actions/stage-changes
        with:
          name: readme-dev-client-playground
          paths: README.md
          description: "update Playground dev client links in README"

  # Single writer to the branch: the job above only uploads its README
  # change as a patch artifact, this job applies it and pushes it with a
  # rebase-retry so a concurrent CI push cannot make it fail.
  publish-staged-changes:
    name: "📤 Publish Staged Changes"
    runs-on: ubuntu-latest
    needs: [check-repository, update-readme]
    if: >-
      always() && github.event_name == 'push'
      && needs.check-repository.outputs.is-upstream == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      # fetch-depth: 0 is required - `git apply --3way` needs the blobs the
      # staged patches were built against.
      - name: "🔄 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "📤 Apply and push all staged changes"
        uses: ./.github/actions/publish-staged-changes
        with:
          branch: ${{ github.ref_name }}
          commit-message: "chore: update Playground dev client links in README [skip ci]"
