<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OSM Vector Map</title>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.5.0/dist/maplibre-gl.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #loading {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
        z-index: 200;
        font-family: sans-serif;
        font-size: 16px;
        color: #333;
        gap: 12px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #ccc;
        border-top-color: #555;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #error {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
        z-index: 200;
        font-family: sans-serif;
        font-size: 15px;
        color: #c00;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading vector map…</span>
    </div>
    <div id="error">
      <span>⚠️ Could not load map.</span>
      <span style="color:#666;font-size:13px">Please check your internet connection and reload.</span>
    </div>
    <div id="map"></div>
    <script>
      var map = null;
      var mapReady = false;
      var pendingMessage = null;
      var activeMarkers = {};
      var vehicleMarkerEl = null;
      var vehicleMarkerInstance = null;
      var peopleModeActive = false;
      var intelligentMovementActive = false;
      var mapMarkerPositions = [];
      var carModeActive = false;

      function sendToRN(msg) {
        var str = JSON.stringify(msg);
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(str);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage(str, '*');
        }
      }

      function updateMarkers(markersData) {
        Object.keys(activeMarkers).forEach(function (id) {
          activeMarkers[id].remove();
        });
        activeMarkers = {};
        mapMarkerPositions = [];

        if (!markersData || !Array.isArray(markersData)) return;

        markersData.forEach(function (markerData) {
          if (!markerData || !markerData.position) return;

          mapMarkerPositions.push({ lng: markerData.position.lng, lat: markerData.position.lat });

          var el = document.createElement('div');
          el.style.cursor = 'pointer';

          if (markerData.icon) {
            el.innerHTML = markerData.icon;
            if (markerData.size && markerData.size.length === 2) {
              el.style.width = markerData.size[0] + 'px';
              el.style.height = markerData.size[1] + 'px';
            }
          } else {
            el.style.width = '24px';
            el.style.height = '24px';
            el.style.backgroundColor = '#1565c0';
            el.style.borderRadius = '50%';
            el.style.border = '2px solid white';
          }

          var markerId = markerData.id;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            sendToRN({ tag: 'onMapMarkerClicked', mapMarkerId: markerId });
          });

          var offset = [0, 0];
          if (
            markerData.iconAnchor &&
            markerData.iconAnchor.length === 2 &&
            markerData.size &&
            markerData.size.length === 2
          ) {
            offset = [
              markerData.size[0] / 2 - markerData.iconAnchor[0],
              markerData.size[1] / 2 - markerData.iconAnchor[1],
            ];
          }

          var marker = new maplibregl.Marker({ element: el, offset: offset })
            .setLngLat([markerData.position.lng, markerData.position.lat])
            .addTo(map);

          activeMarkers[markerId] = marker;
        });
      }

      var PEOPLE_COUNT = 80;
      var PEOPLE_RADIUS_DEG = 0.004;
      var PEOPLE_SCREEN_RADIUS_PX = 200; // target screen radius for zoom-independent distribution
      var PEOPLE_CIRCLE_RADIUS = 5;
      var DEG_TO_RAD = Math.PI / 180;
      var PEOPLE_SPEED = 0.000004;
      var PEOPLE_ANIMATION_MS = 50;
      var PEOPLE_TURN_RATE = 0.15; // fraction of PEOPLE_SPEED added as random direction change per frame
      var PEOPLE_BOUNDARY_FORCE = 0.002; // restoring acceleration applied when a particle exceeds the radius
      var peopleParticles = [];
      var peopleAnimationInterval = null;
      var currentPeopleRadiusDeg = PEOPLE_RADIUS_DEG;

      // Intelligent movement constants
      var PEOPLE_HUMAN_SPEED = 0.000000624;      // degrees per frame at 50ms tick (= 5 km/h at lat ~51°)
      var PEOPLE_TRAVEL_TURN_RATE = 0.1;         // fraction of heading-to-target difference applied per frame
      var PEOPLE_TRAVEL_HEADING_NOISE = 0.08;    // random heading perturbation per frame (simulates street curves)
      var PEOPLE_SPEED_VARIATION_MIN = 0.7;      // minimum speed multiplier relative to PEOPLE_HUMAN_SPEED
      var PEOPLE_SPEED_VARIATION_RANGE = 0.3;    // speed range so max multiplier = 1.0 (capped at 5 km/h)
      var ARRIVAL_THRESHOLD_DEG = 0.00008;       // distance at which a particle is considered to have arrived

      function computePeopleRadiusDeg() {
        if (!map) return PEOPLE_RADIUS_DEG;
        var zoom = map.getZoom();
        var center = map.getCenter();
        var metersPerPx = 40075016.686 * Math.cos(center.lat * DEG_TO_RAD) / (256 * Math.pow(2, zoom));
        var radiusMeters = PEOPLE_SCREEN_RADIUS_PX * metersPerPx;
        return radiusMeters / 111320;
      }

      function generatePeopleParticles(center, count, radiusDeg) {
        var particles = [];
        for (var i = 0; i < count; i++) {
          var angle = Math.random() * 2 * Math.PI;
          var r = Math.random() * radiusDeg;
          var lng = center[0] + r * Math.cos(angle) / Math.cos(center[1] * DEG_TO_RAD);
          var lat = center[1] + r * Math.sin(angle);
          var vAngle = Math.random() * 2 * Math.PI;
          var speed = PEOPLE_SPEED * (0.5 + Math.random() * 0.5);
          particles.push({
            lng: lng, lat: lat,
            vx: speed * Math.cos(vAngle), vy: speed * Math.sin(vAngle),
            baseLng: center[0], baseLat: center[1],
          });
        }
        return particles;
      }

      function updatePeopleParticles() {
        var MAX_SPEED = PEOPLE_SPEED * 2;
        var radius = currentPeopleRadiusDeg;
        for (var i = 0; i < peopleParticles.length; i++) {
          var p = peopleParticles[i];
          p.vx += (Math.random() - 0.5) * PEOPLE_TURN_RATE * PEOPLE_SPEED;
          p.vy += (Math.random() - 0.5) * PEOPLE_TURN_RATE * PEOPLE_SPEED;
          var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (speed > MAX_SPEED) { p.vx = p.vx / speed * MAX_SPEED; p.vy = p.vy / speed * MAX_SPEED; }
          p.lng += p.vx;
          p.lat += p.vy;
          var dx = p.lng - p.baseLng;
          var dy = p.lat - p.baseLat;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > radius) {
            p.vx -= dx * PEOPLE_BOUNDARY_FORCE;
            p.vy -= dy * PEOPLE_BOUNDARY_FORCE;
          }
        }
      }

      // ── Intelligent Movement ──────────────────────────────────────────────────

      function pickFromNearest5(p) {
        var positions = mapMarkerPositions;
        if (positions.length === 0) return null;
        var withDist = [];
        for (var i = 0; i < positions.length; i++) {
          var dx = positions[i].lng - p.lng;
          var dy = positions[i].lat - p.lat;
          withDist.push({ pos: positions[i], dist: Math.sqrt(dx * dx + dy * dy) });
        }
        withDist.sort(function(a, b) { return a.dist - b.dist; });
        var k = Math.min(5, withDist.length);
        return withDist[Math.floor(Math.random() * k)].pos;
      }

      function updateIntelligentParticles() {
        for (var i = 0; i < peopleParticles.length; i++) {
          var p = peopleParticles[i];
          if (!p.state) {
            p.state = 'traveling';
            p.heading = Math.random() * 2 * Math.PI;
            p.vx = 0;
            p.vy = 0;
            p.speedMultiplier = PEOPLE_SPEED_VARIATION_MIN + Math.random() * PEOPLE_SPEED_VARIATION_RANGE;
            var init = pickFromNearest5(p);
            if (init) { p.targetLng = init.lng; p.targetLat = init.lat; }
          }
          if (p.state === 'traveling') {
            if (p.targetLng === undefined || p.targetLat === undefined) {
              var next = pickFromNearest5(p);
              if (next) {
                p.targetLng = next.lng;
                p.targetLat = next.lat;
                p.speedMultiplier = PEOPLE_SPEED_VARIATION_MIN + Math.random() * PEOPLE_SPEED_VARIATION_RANGE;
              }
            }
            if (p.targetLng !== undefined && p.targetLat !== undefined) {
              var dtx = p.targetLng - p.lng;
              var dty = p.targetLat - p.lat;
              var distToTarget = Math.sqrt(dtx * dtx + dty * dty);
              if (distToTarget < ARRIVAL_THRESHOLD_DEG) {
                p.lng = p.targetLng;
                p.lat = p.targetLat;
                p.vx = 0;
                p.vy = 0;
                var arrived = pickFromNearest5(p);
                if (arrived) {
                  p.targetLng = arrived.lng;
                  p.targetLat = arrived.lat;
                  p.speedMultiplier = PEOPLE_SPEED_VARIATION_MIN + Math.random() * PEOPLE_SPEED_VARIATION_RANGE;
                } else { p.targetLng = undefined; p.targetLat = undefined; }
              } else {
                var targetHeading = Math.atan2(dtx, dty);
                var headingDiff = targetHeading - p.heading;
                while (headingDiff > Math.PI) headingDiff -= 2 * Math.PI;
                while (headingDiff < -Math.PI) headingDiff += 2 * Math.PI;
                p.heading += headingDiff * PEOPLE_TRAVEL_TURN_RATE + (Math.random() - 0.5) * PEOPLE_TRAVEL_HEADING_NOISE;
                var humanSpeed = PEOPLE_HUMAN_SPEED * p.speedMultiplier;
                p.vx = Math.sin(p.heading) * humanSpeed;
                p.vy = Math.cos(p.heading) * humanSpeed;
                p.lng += p.vx;
                p.lat += p.vy;
              }
            }
          }
        }
      }

      // ── Car Mode (Fiktiver Autofahrer Modus) ─────────────────────────────────

      var CAR_COUNT = 15;
      var CAR_SPEED_DEG_PER_FRAME = 0.0000062; // ~50 km/h at lat 51°, 50ms tick
      var CAR_ANIMATION_MS = 50;
      var CAR_CIRCLE_RADIUS = 5;
      var VALHALLA_BASE_URL = 'https://valhalla1.openstreetmap.de/route';
      var carParticles = [];
      var carAnimationInterval = null;

      function getRandomNearbyPoint(baseLng, baseLat, minDeg, maxDeg) {
        var angle = Math.random() * 2 * Math.PI;
        var r = minDeg + Math.random() * (maxDeg - minDeg);
        return {
          lng: baseLng + r * Math.cos(angle) / Math.cos(baseLat * DEG_TO_RAD),
          lat: baseLat + r * Math.sin(angle),
        };
      }

      // Decode Valhalla's encoded polyline (precision=6) to [[lng, lat], ...]
      function decodeValhallaPolyline(encoded) {
        var coords = [];
        var index = 0, lat = 0, lng = 0;
        while (index < encoded.length) {
          var encodedByte, shift = 0, result = 0;
          do {
            encodedByte = encoded.charCodeAt(index++) - 63;
            result |= (encodedByte & 0x1f) << shift;
            shift += 5;
          } while (encodedByte >= 0x20);
          lat += (result & 1) ? ~(result >> 1) : (result >> 1);
          shift = 0; result = 0;
          do {
            encodedByte = encoded.charCodeAt(index++) - 63;
            result |= (encodedByte & 0x1f) << shift;
            shift += 5;
          } while (encodedByte >= 0x20);
          lng += (result & 1) ? ~(result >> 1) : (result >> 1);
          coords.push([lng / 1e6, lat / 1e6]);
        }
        return coords;
      }

      function fetchValhallaRoute(fromLng, fromLat, toLng, toLat, callback) {
        var params = JSON.stringify({
          locations: [
            { lat: fromLat, lon: fromLng },
            { lat: toLat, lon: toLng },
          ],
          costing: 'auto',
          directions_options: { units: 'kilometers' },
          directions_type: 'none',
        });
        var url = VALHALLA_BASE_URL + '?json=' + encodeURIComponent(params);
        fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (
              data.trip &&
              data.trip.legs &&
              data.trip.legs[0] &&
              data.trip.legs[0].shape
            ) {
              var coords = decodeValhallaPolyline(data.trip.legs[0].shape);
              if (coords.length >= 2) {
                callback(null, coords);
              } else {
                callback(new Error('no-route'));
              }
            } else {
              callback(new Error('no-route'));
            }
          })
          .catch(function (e) { callback(e); });
      }

      function fetchCarRoute(car) {
        if (car.fetching) return;
        car.fetching = true;
        var center = map ? map.getCenter() : { lng: 0, lat: 0 };
        var dest = getRandomNearbyPoint(center.lng, center.lat, 0.002, 0.006);
        fetchValhallaRoute(car.lng, car.lat, dest.lng, dest.lat, function (err, coords) {
          car.fetching = false;
          if (!carModeActive) return;
          if (err || !coords || coords.length < 2) {
            // fallback: pick a new destination next tick
            car.route = null;
            car.routeSegIdx = 0;
            car.routeFrac = 0;
            return;
          }
          car.route = coords; // array of [lng, lat]
          car.routeSegIdx = 0;
          car.routeFrac = 0;
          // Snap car to start of route
          car.lng = coords[0][0];
          car.lat = coords[0][1];
        });
      }

      function generateCarParticles(center, count) {
        var particles = [];
        for (var i = 0; i < count; i++) {
          var pt = getRandomNearbyPoint(center[0], center[1], 0, 0.004);
          particles.push({
            lng: pt.lng,
            lat: pt.lat,
            route: null,
            routeSegIdx: 0,
            routeFrac: 0,
            fetching: false,
          });
        }
        return particles;
      }

      function updateCarParticles() {
        for (var i = 0; i < carParticles.length; i++) {
          var c = carParticles[i];
          if (!c.route || c.route.length < 2) {
            fetchCarRoute(c);
            continue;
          }
          // Move along current segment
          var segStart = c.route[c.routeSegIdx];
          var segEnd = c.route[c.routeSegIdx + 1];
          if (!segEnd) {
            // Reached end of route — fetch a new one
            c.route = null;
            fetchCarRoute(c);
            continue;
          }
          var dx = segEnd[0] - segStart[0];
          var dy = segEnd[1] - segStart[1];
          var segLen = Math.sqrt(dx * dx + dy * dy);
          if (segLen === 0) {
            c.routeSegIdx++;
            if (c.routeSegIdx >= c.route.length - 1) {
              c.route = null;
              fetchCarRoute(c);
            }
            continue;
          }
          c.routeFrac += CAR_SPEED_DEG_PER_FRAME / segLen;
          if (c.routeFrac >= 1) {
            // Jump to next segment(s), carrying over the overshoot distance
            while (c.routeFrac >= 1 && c.routeSegIdx < c.route.length - 2) {
              var prevLen = segLen;
              c.routeFrac -= 1; // overshoot fraction relative to prevLen
              c.routeSegIdx++;
              segStart = c.route[c.routeSegIdx];
              segEnd = c.route[c.routeSegIdx + 1];
              if (!segEnd) break;
              dx = segEnd[0] - segStart[0];
              dy = segEnd[1] - segStart[1];
              segLen = Math.sqrt(dx * dx + dy * dy);
              if (segLen > 0) c.routeFrac = c.routeFrac * prevLen / segLen;
            }
            if (c.routeSegIdx >= c.route.length - 1) {
              c.route = null;
              fetchCarRoute(c);
              continue;
            }
          }
          segStart = c.route[c.routeSegIdx];
          segEnd = c.route[c.routeSegIdx + 1];
          if (segEnd) {
            c.lng = segStart[0] + (segEnd[0] - segStart[0]) * c.routeFrac;
            c.lat = segStart[1] + (segEnd[1] - segStart[1]) * c.routeFrac;
          }
        }
      }

      function carParticlesToGeoJSON() {
        var features = [];
        for (var i = 0; i < carParticles.length; i++) {
          features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [carParticles[i].lng, carParticles[i].lat] }, properties: {} });
        }
        return { type: 'FeatureCollection', features: features };
      }

      function startCarAnimation() {
        if (carAnimationInterval) return;
        carAnimationInterval = setInterval(function () {
          if (!map || !carModeActive || !map.getSource('car-source')) return;
          updateCarParticles();
          map.getSource('car-source').setData(carParticlesToGeoJSON());
        }, CAR_ANIMATION_MS);
      }

      function stopCarAnimation() {
        if (carAnimationInterval) { clearInterval(carAnimationInterval); carAnimationInterval = null; }
        carParticles = [];
      }

      function addCarLayer() {
        if (!map) return;
        var center = map.getCenter();
        carParticles = generateCarParticles([center.lng, center.lat], CAR_COUNT);
        var geojson = carParticlesToGeoJSON();
        if (map.getSource('car-source')) {
          map.getSource('car-source').setData(geojson);
        } else {
          map.addSource('car-source', { type: 'geojson', data: geojson });
          var firstFillExtrusion = null;
          var layers = map.getStyle().layers;
          for (var i = 0; i < layers.length; i++) {
            if (layers[i].type === 'fill-extrusion') { firstFillExtrusion = layers[i].id; break; }
          }
          map.addLayer({
            id: 'car-layer',
            type: 'circle',
            source: 'car-source',
            paint: {
              'circle-radius': CAR_CIRCLE_RADIUS,
              'circle-color': '#1565c0',
              'circle-opacity': 0.9,
              'circle-stroke-width': 0.5,
              'circle-stroke-color': '#ffffff',
            },
          }, firstFillExtrusion || undefined);
        }
        startCarAnimation();
      }

      function removeCarLayer() {
        if (!map) return;
        stopCarAnimation();
        if (map.getLayer('car-layer')) map.removeLayer('car-layer');
        if (map.getSource('car-source')) map.removeSource('car-source');
      }

      // ─────────────────────────────────────────────────────────────────────────

      function particlesToGeoJSON() {
        var features = [];
        for (var i = 0; i < peopleParticles.length; i++) {
          features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [peopleParticles[i].lng, peopleParticles[i].lat] }, properties: {} });
        }
        return { type: 'FeatureCollection', features: features };
      }

      function startPeopleAnimation() {
        if (peopleAnimationInterval) return;
        peopleAnimationInterval = setInterval(function () {
          if (!map || !peopleModeActive || !map.getSource('people-source')) return;
          if (intelligentMovementActive) {
            updateIntelligentParticles();
          } else {
            updatePeopleParticles();
          }
          map.getSource('people-source').setData(particlesToGeoJSON());
        }, PEOPLE_ANIMATION_MS);
      }

      function stopPeopleAnimation() {
        if (peopleAnimationInterval) { clearInterval(peopleAnimationInterval); peopleAnimationInterval = null; }
        peopleParticles = [];
      }

      function addPeopleLayer() {
        if (!map) return;
        currentPeopleRadiusDeg = computePeopleRadiusDeg();
        var center = map.getCenter();
        peopleParticles = generatePeopleParticles([center.lng, center.lat], PEOPLE_COUNT, currentPeopleRadiusDeg);
        var geojson = particlesToGeoJSON();
        if (map.getSource('people-source')) {
          map.getSource('people-source').setData(geojson);
        } else {
          map.addSource('people-source', { type: 'geojson', data: geojson });
          var firstFillExtrusion = null;
          var layers = map.getStyle().layers;
          for (var i = 0; i < layers.length; i++) {
            if (layers[i].type === 'fill-extrusion') { firstFillExtrusion = layers[i].id; break; }
          }
          map.addLayer({
            id: 'people-layer',
            type: 'circle',
            source: 'people-source',
            paint: {
              'circle-radius': PEOPLE_CIRCLE_RADIUS,
              'circle-color': '#e53935',
              'circle-opacity': 0.85,
              'circle-stroke-width': 0.5,
              'circle-stroke-color': '#ffffff',
            },
          }, firstFillExtrusion || undefined);
        }
        startPeopleAnimation();
      }

      function removePeopleLayer() {
        if (!map) return;
        stopPeopleAnimation();
        if (map.getLayer('people-layer')) map.removeLayer('people-layer');
        if (map.getSource('people-source')) map.removeSource('people-source');
      }

      function updateVehicleMarker(markerData) {
        if (!markerData) {
          if (vehicleMarkerInstance) {
            vehicleMarkerInstance.remove();
            vehicleMarkerInstance = null;
          }
          if (vehicleMarkerEl) {
            vehicleMarkerEl.remove();
            vehicleMarkerEl = null;
          }
          return;
        }
        if (!vehicleMarkerEl) {
          vehicleMarkerEl = document.createElement('div');
          vehicleMarkerEl.style.pointerEvents = 'none';
        }
        if (markerData.icon) {
          vehicleMarkerEl.innerHTML = markerData.icon;
          if (markerData.size && markerData.size.length === 2) {
            vehicleMarkerEl.style.width = markerData.size[0] + 'px';
            vehicleMarkerEl.style.height = markerData.size[1] + 'px';
          }
        }
        var lngLat = [markerData.position.lng, markerData.position.lat];
        if (vehicleMarkerInstance) {
          vehicleMarkerInstance.setLngLat(lngLat);
        } else {
          vehicleMarkerInstance = new maplibregl.Marker({ element: vehicleMarkerEl, anchor: 'center' })
            .setLngLat(lngLat)
            .addTo(map);
        }
      }

      function applyMessage(data) {
        if (!map) return;

        if (data.resetBearing) {
          map.resetNorth({ animate: true });
          return;
        }

        if (data.disableInteraction) {
          map.dragPan.disable();
          map.scrollZoom.disable();
          map.doubleClickZoom.disable();
          map.touchZoomRotate.disable();
          map.keyboard.disable();
        } else if (data.enableInteraction) {
          map.dragPan.enable();
          map.scrollZoom.enable();
          map.doubleClickZoom.enable();
          map.touchZoomRotate.enable();
          map.keyboard.enable();
        }

        if (data.mapStyle) {
          map.setStyle(data.mapStyle);
        }

        var centerLngLat = null;
        var targetZoom = null;

        if (
          data.mapCenterPosition &&
          data.mapCenterPosition.lat != null &&
          data.mapCenterPosition.lng != null
        ) {
          centerLngLat = [data.mapCenterPosition.lng, data.mapCenterPosition.lat];
          targetZoom = data.zoom != null ? data.zoom : map.getZoom();
        } else if (data.center) {
          centerLngLat = data.center;
          targetZoom = data.zoom != null ? data.zoom : map.getZoom();
        }

        if (centerLngLat) {
          var opts = {
            center: centerLngLat,
            zoom: targetZoom,
            pitch: data.pitch != null ? data.pitch : map.getPitch(),
          };
          if (data.bearing != null) {
            opts.bearing = data.bearing;
          }
          if (data.easeAnimation) {
            opts.duration = data.easeDuration != null ? data.easeDuration : 100;
            map.easeTo(opts);
          } else if (data.animate !== false && data.useFlyAnimation !== false) {
            map.flyTo(opts);
          } else {
            map.jumpTo(opts);
          }
        } else if (data.bearing != null) {
          // Bearing-only update: rotate around the current map center
          var bearingOpts = { bearing: data.bearing };
          if (data.easeAnimation) {
            bearingOpts.duration = data.easeDuration != null ? data.easeDuration : 100;
            map.easeTo(bearingOpts);
          } else {
            map.jumpTo(bearingOpts);
          }
        } else if (data.zoomTo != null) {
          map.easeTo({ zoom: data.zoomTo, duration: data.easeDuration != null ? data.easeDuration : 300 });
        } else if (data.pitch != null) {
          map.easeTo({ pitch: data.pitch });
        }

        if (data.mapMarkers !== undefined) {
          updateMarkers(data.mapMarkers);
        }

        if (data.vehicleMarker !== undefined) {
          updateVehicleMarker(data.vehicleMarker);
        }

        if (data.intelligentMovement !== undefined) {
          intelligentMovementActive = data.intelligentMovement;
          // Reset particle states when toggling mode so they reinitialise properly
          for (var im = 0; im < peopleParticles.length; im++) {
            delete peopleParticles[im].state;
          }
        }

        if (data.peopleCount !== undefined) {
          var newCount = Math.max(1, Math.floor(data.peopleCount));
          if (newCount !== PEOPLE_COUNT) {
            PEOPLE_COUNT = newCount;
            if (peopleModeActive) {
              removePeopleLayer();
              addPeopleLayer();
            }
          }
        }

        if (data.peopleMode !== undefined) {
          peopleModeActive = data.peopleMode;
          if (peopleModeActive) {
            addPeopleLayer();
          } else {
            removePeopleLayer();
          }
        }

        if (data.carMode !== undefined) {
          carModeActive = data.carMode;
          if (carModeActive) {
            addCarLayer();
          } else {
            removeCarLayer();
          }
        }
      }

      function handleIncomingData(data) {
        if (!mapReady) {
          pendingMessage = data;
        } else {
          applyMessage(data);
        }
      }

      function parseAndHandle(raw) {
        try {
          var data = typeof raw === 'string' ? JSON.parse(raw) : raw;
          handleIncomingData(data);
        } catch (e) {}
      }

      window.addEventListener('message', function (e) {
        parseAndHandle(e.data);
      });
      document.addEventListener('message', function (e) {
        parseAndHandle(e.data);
      });

      function initMap(initialCenter, initialZoom, initialPitch) {
        map = new maplibregl.Map({
          container: 'map',
          style: 'https://tiles.openfreemap.org/styles/liberty',
          center: initialCenter || [10.0, 51.3],
          zoom: initialZoom != null ? initialZoom : 16,
          pitch: initialPitch != null ? initialPitch : 20,
          attributionControl: { compact: true },
        });

        map.on('load', function () {
          document.getElementById('loading').style.display = 'none';
          mapReady = true;
          if (pendingMessage) {
            applyMessage(pendingMessage);
            pendingMessage = null;
          }
          sendToRN({ tag: 'MapComponentMounted', version: '1.0' });
        });

        map.on('error', function (e) {
          console.error('MapLibre error:', e.error);
          if (!mapReady) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
            sendToRN({ tag: 'MapError', message: e.error ? e.error.message : 'unknown' });
          }
        });

        map.on('zoomend', function () {
          sendToRN({ tag: 'onZoomEnd', zoom: map.getZoom() });
        });

        map.on('pitchend', function () {
          sendToRN({ tag: 'onPitchEnd', pitch: map.getPitch() });
        });

        map.on('click', function () {
          sendToRN({ tag: 'MapTapped' });
        });

        map.on('styledata', function () {
          if (peopleModeActive) {
            if (!map.getSource('people-source')) {
              addPeopleLayer();
            }
          }
          if (carModeActive) {
            if (!map.getSource('car-source')) {
              addCarLayer();
            }
          }
        });
      }

      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var lat = parseFloat(params.get('lat'));
          var lng = parseFloat(params.get('lng'));
          var zoom = parseFloat(params.get('zoom'));
          if (!isNaN(lat) && !isNaN(lng)) {
            initMap([lng, lat], !isNaN(zoom) ? zoom : null);
            return;
          }
        } catch (e) {}
        initMap(null, null);
      })();
    </script>
  </body>
</html>
