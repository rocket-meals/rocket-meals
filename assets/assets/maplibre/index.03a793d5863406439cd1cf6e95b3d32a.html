<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OSM Vector Map</title>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.5.0/dist/maplibre-gl.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #loading {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
        z-index: 200;
        font-family: sans-serif;
        font-size: 16px;
        color: #333;
        gap: 12px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #ccc;
        border-top-color: #555;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #error {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
        z-index: 200;
        font-family: sans-serif;
        font-size: 15px;
        color: #c00;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading vector map…</span>
    </div>
    <div id="error">
      <span>⚠️ Could not load map.</span>
      <span style="color:#666;font-size:13px">Please check your internet connection and reload.</span>
    </div>
    <div id="map"></div>
    <script>
      var map = null;
      var mapReady = false;
      var pendingMessage = null;

      function sendToRN(msg) {
        var str = JSON.stringify(msg);
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(str);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage(str, '*');
        }
      }

      function applyMessage(data) {
        if (!map) return;
        if (data.center) {
          var opts = { center: data.center, zoom: data.zoom != null ? data.zoom : map.getZoom() };
          if (data.animate === false) {
            map.jumpTo(opts);
          } else {
            map.flyTo(opts);
          }
        }
      }

      function handleIncomingData(data) {
        if (!mapReady) {
          pendingMessage = data;
        } else {
          applyMessage(data);
        }
      }

      function parseAndHandle(raw) {
        try {
          var data = typeof raw === 'string' ? JSON.parse(raw) : raw;
          handleIncomingData(data);
        } catch (e) {}
      }

      window.addEventListener('message', function (e) {
        parseAndHandle(e.data);
      });
      document.addEventListener('message', function (e) {
        parseAndHandle(e.data);
      });

      function initMap(initialCenter, initialZoom) {
        map = new maplibregl.Map({
          container: 'map',
          style: 'https://tiles.openfreemap.org/styles/liberty',
          center: initialCenter || [10.0, 51.3],
          zoom: initialZoom != null ? initialZoom : 5,
          attributionControl: { compact: true },
        });

        map.on('load', function () {
          document.getElementById('loading').style.display = 'none';
          mapReady = true;
          if (pendingMessage) {
            applyMessage(pendingMessage);
            pendingMessage = null;
          }
          sendToRN({ tag: 'MapLoaded' });
        });

        map.on('error', function (e) {
          console.error('MapLibre error:', e.error);
          if (!mapReady) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
            sendToRN({ tag: 'MapError', message: e.error ? e.error.message : 'unknown' });
          }
        });

        map.on('zoomend', function () {
          sendToRN({ tag: 'onZoomEnd', zoom: map.getZoom() });
        });
      }

      initMap(null, null);
    </script>
  </body>
</html>
