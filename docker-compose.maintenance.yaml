version: "3.9"
services:
  compose-maintenance:
    image: docker:26.1.0-cli
    container_name: compose-maintenance
    restart: unless-stopped
    environment:
      MAIN_COMPOSE_PROJECT_DIR: "${MAIN_COMPOSE_PROJECT_DIR:-.}"
      MAIN_COMPOSE_FILE: "${MAIN_COMPOSE_FILE:-docker-compose.yaml}"
      MAIN_COMPOSE_PROJECT_NAME: "${MAIN_COMPOSE_PROJECT_NAME:-}"
      CRON_SCHEDULE_MINUTES: "${CRON_SCHEDULE_MINUTES:-1}"
      CRON_SCHEDULE_DAYS: "${CRON_SCHEDULE_DAYS:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace/rocket-meals:ro
      - ./ops/maintenance/restart_main_compose.sh:/usr/local/bin/restart_main_compose.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        MINUTES="${CRON_SCHEDULE_MINUTES:-1}"
        DAYS="${CRON_SCHEDULE_DAYS:-0}"

        case "${MINUTES}" in
          ''|*[!0-9]*)
            echo "Invalid CRON_SCHEDULE_MINUTES '${MINUTES}'" >&2
            exit 1
            ;;
          0)
            echo "CRON_SCHEDULE_MINUTES must be greater than 0" >&2
            exit 1
            ;;
        esac

        case "${DAYS}" in
          ''|*[!0-9]*)
            echo "Invalid CRON_SCHEDULE_DAYS '${DAYS}'" >&2
            exit 1
            ;;
        esac

        if [ "${DAYS}" -gt 0 ]; then
          HOURS=$((${MINUTES} / 60))
          MINUTE_OF_HOUR=$((${MINUTES} % 60))

          if [ "${HOURS}" -ge 24 ]; then
            echo "CRON_SCHEDULE_MINUTES must be less than 1440 when CRON_SCHEDULE_DAYS is greater than 0" >&2
            exit 1
          fi

          CRON_SCHEDULE="${MINUTE_OF_HOUR} ${HOURS} */${DAYS} * *"
        else
          CRON_SCHEDULE="*/${MINUTES} * * * *"
        fi

        echo "Using cron schedule '${CRON_SCHEDULE}'" >&2
        echo "${CRON_SCHEDULE} /usr/local/bin/restart_main_compose.sh" > /etc/crontabs/root
        crond -f -L /var/log/cron.log
