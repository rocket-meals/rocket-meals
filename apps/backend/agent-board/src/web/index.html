<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agent Board">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Agent Board</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef0f3; --text: #1b1f24; --muted: #5f6b7a;
  --border: #d9dee5; --accent: #2563eb; --accent-text: #ffffff;
  --open: #1a7f37; --progress: #9a6700; --human: #c2410c; --closed: #6e40c9; --danger: #b42318;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d23; --surface-2: #23272f; --text: #e6e8eb; --muted: #9aa4b2;
    --border: #2e333c; --accent: #4c8dff; --accent-text: #0b0d10;
    --open: #3fb950; --progress: #d29922; --human: #f0883e; --closed: #a371f7; --danger: #f85149;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d23; --surface-2: #23272f; --text: #e6e8eb; --muted: #9aa4b2;
  --border: #2e333c; --accent: #4c8dff; --accent-text: #0b0d10;
  --open: #3fb950; --progress: #d29922; --human: #f0883e; --closed: #a371f7; --danger: #f85149;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; overflow-x: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
a { color: var(--accent); text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border);
}
header.top h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px;
  min-height: 40px; cursor: pointer; white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; }
.tabs { display: flex; gap: 6px; margin: 12px 0 8px; flex-wrap: wrap; }
.tab { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 15px; }
.tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab .count { margin-left: 4px; font-size: 13px; opacity: .8; }
.tab .count.alert { background: var(--human); color: #fff; border-radius: 999px; padding: 0 6px; opacity: 1; }
.search { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { font-size: 13px; border-radius: 999px; padding: 2px 10px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
a.card { color: inherit; display: block; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; white-space: nowrap; }
.s-open { color: var(--open); } .s-in_progress { color: var(--progress); } .s-needs_human { color: var(--human); } .s-closed { color: var(--closed); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
.timeline { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.event { color: var(--muted); font-size: 13px; padding: 0 12px; overflow-wrap: anywhere; }
.comment.mine { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.comment.agent { background: var(--surface-2); }
.atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.att { display: flex; align-items: center; gap: 6px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; max-width: 100%; overflow: hidden; }
.att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; display: block; }
.att.img { padding: 0; border: none; }
form.compose { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
textarea, input[type="text"], input[type="password"] {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
}
textarea { min-height: 96px; resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .grow { flex: 1; }
.filelabel { display: inline-flex; align-items: center; gap: 6px; }
.filelabel input { display: none; }
.files-picked { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
.banner { border-radius: var(--radius); padding: 10px 12px; margin-top: 12px; border: 1px solid var(--human); color: var(--human); background: color-mix(in srgb, var(--human) 10%, var(--surface)); }
.error { color: var(--danger); font-size: 14px; }
.label-edit { display: flex; gap: 6px; margin-top: 8px; }
.label-edit input { flex: 1; min-width: 0; }
.chip .x { margin-left: 4px; opacity: .7; }
.chip.model { cursor: default; }
.chip.model select { border: none; background: transparent; font-size: 13px; padding: 0; cursor: pointer; }
.model-picker { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: 100%; }
.model-picker .model-custom[hidden] { display: none; }
.chip.model .model-custom { font-size: 13px; padding: 2px 6px; width: 14em; max-width: 100%; }
label.field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
label.field select { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.live.on { background: var(--open); }
</style>
</head>
<body>
<header class="top">
  <a id="back" class="btn" href="#/" hidden aria-label="Zurück">‹</a>
  <h1 id="heading">Agent Board</h1>
  <span id="live" class="live" title="Live-Verbindung"></span>
  <a id="newBtn" class="btn primary" href="#/new">Neu</a>
</header>
<main class="wrap" id="app"><p class="empty">Lädt …</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
